<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-kit-kind" content="idle">
<title>idle: a9-ret-css-shake-linear</title>
<style>html { background: #fff } body { margin: 0 } .b { position: fixed; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: #333 }</style>
</head>
<body>
<script>
const MOTION = { stillAtS: 2, maxStepS: 0.05, P: 3, K: [[0.2,0],[0.282,-1],[0.364,2],[0.446,-4],[0.528,4],[0.61,-4],[0.692,4],[0.774,-4],[0.856,2],[0.938,-1],[1.02,0]] };
const UNITS = {"x":"px"};
const clamp01 = (p) => Math.min(1, Math.max(0, p));
const eis = (p) => (1 - Math.cos(Math.PI * clamp01(p))) / 2;
const eout = (p) => 1 - (1 - clamp01(p)) ** 2;
const ein = (p) => clamp01(p) ** 2;
const spr = (t, w, z, tEnd) => (t <= 0 ? 0 : t >= tEnd ? 1 : 1 - Math.exp(-z * w * t) * Math.cos(w * Math.sqrt(1 - z * z) * t) * (1 - t / tEnd));
const settle = (p, os) => { p = clamp01(p); return p < 0.5 ? (1 + os) * eis(2 * p) : 1 + os - os * eis(2 * p - 1); };
// Piecewise eased path through keys [[s, v], ...]: eased in-out between keys, holds before the first and after the last.
const keys = (k, s) => { if (s <= k[0][0]) return k[0][1]; for (let i = 0; i + 1 < k.length; i++) if (s < k[i + 1][0]) return k[i][1] + (k[i + 1][1] - k[i][1]) * eis((s - k[i][0]) / (k[i + 1][0] - k[i][0])); return k[k.length - 1][1]; };
function valuesAt(T) {
  const k = MOTION.K, s = T % MOTION.P; if (s <= k[0][0] || s >= k[k.length - 1][0]) return { x: 0 }; let i = 0; while (s >= k[i + 1][0]) i++; return { x: k[i][1] + (k[i + 1][1] - k[i][1]) * (s - k[i][0]) / (k[i + 1][0] - k[i][0]) };
}
</script>
<script src="../loops/loops.js"></script>
</body>
</html>
