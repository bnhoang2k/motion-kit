<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-kind" content="idle">
<title>c16-svg-stroke-halo</title>
<style>html,body{margin:0;background:#101418;height:100%;overflow:hidden}
.o{position:absolute;background:#f0c040;border-radius:50%}
.sq{position:absolute;background:#60c0f0}
</style>
</head><body>
<svg id="s" width="1280" height="720" style="position:absolute;left:0;top:0"><circle id="c" r="20" cy="360" fill="none" stroke="#f0c040" stroke-width="10"/></svg>
<script src="../mk.js"></script>
<script>
const MOTION = {"maxStep":0.05,"period":2};
const $ = (id) => document.getElementById(id);
MK.pure({ kind: "idle", cap: MOTION.maxStep * 1000, draw(t, inp, s) {
const tt = MK.REDUCED ? 0 : t; const x = 640 + 200 * Math.sin(2 * Math.PI * tt / 1000 / MOTION.period); $("c").setAttribute("cx", x);
  return { values: { x }, units: { x: "px" }, objects: { ring: { box: [x - 20, 340, 40, 40], moves: ["x"], halo: 5 } } };
} });
</script>
</body></html>
