<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-bar" content="af05b-jump-no-holds">
<title>af05b-jump-no-holds</title>
<style>html,body{margin:0;background:#101418;height:100%;overflow:hidden}
.o{position:absolute;background:#f0c040;border-radius:50%}
.sq{position:absolute;background:#60c0f0}
</style>
</head><body>
<div class="o" id="a"></div>
<script src="../mk.js"></script>
<script>
const MOTION = {"maxStep":0.05,"period":4,"rate":2};
const el = document.getElementById("a");
function pose(f) { const n = Math.round(MOTION.period * 60); const k = f % n;
  let x; if (k < 60) x = 300 + 2 * Math.floor(k / 2); else if (k < 120) x = 396 + 2 * Math.floor((k - 60) / 2); else x = 456 - 156 * Math.floor((k - 120) / 2) * 2 / (n - 120);
  return { x: Math.round(x), y: 340 }; }
MK.pure({ kind: "idle", cap: MOTION.maxStep * 1000, draw(t) {
  const f = MK.REDUCED ? 0 : MK.frameOf(t);
  const p = pose(f);
  MK.place(el, p.x, p.y, p.w ?? 40, p.h ?? 40);
  
  return { values: { x: p.x }, units: {"x":"px"},
    objects: { dot: { box: MK.boxOf(el), moves: ["x"] } } };
} });
</script>
</body></html>
