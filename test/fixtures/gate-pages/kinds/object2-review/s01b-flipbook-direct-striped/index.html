<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-bar" content="s01b-flipbook-direct-striped">
<title>s01b-flipbook-direct-striped</title>
<style>html,body{margin:0;background:#101418}
.o{position:absolute;background:#f0c040;border-radius:50%}
.sq{position:absolute;background:#60c0f0}
body{background:repeating-linear-gradient(0deg,#101418 0 20px,#1c2430 20px 40px)}</style>
</head><body>
<div style="height:3000px"></div><div class="o" id="a" style="position:fixed"></div>
<script src="../mk.js"></script>
<script>
const MOTION = {"maxStep":0.05,"per":20,"stepPx":12,"smooth":0.12};
const el = document.getElementById("a");
function fxOf(s) {
  if (MK.REDUCED) return 300 + 120 * Math.floor(s.target / 500);
  let d = Math.floor(s.y / MOTION.per);
  
  return 300 + MOTION.stepPx * d;
}
MK.run({ kind: "scroll", cap: MOTION.maxStep * 1000,
  init: () => ({ y: 0, target: 0, t: 0, prevT: 0, moving: 0 }),
  step(s, dt, inp, t) {
    s.t = t; s.prevT = s.target; s.target = inp.scrollY;
    s.y = s.target;
  },
  render(s) { MK.place(el, fxOf(s), 300, 40, 40); },
  report(s) { const fx = fxOf(s); return { values: { fx }, units: { fx: "px" }, objects: { dot: { box: MK.boxOf(el), moves: ["fx"] } } }; },
});
</script>
</body></html>
