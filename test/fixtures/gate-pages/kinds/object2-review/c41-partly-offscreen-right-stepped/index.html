<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-bar" content="c41-partly-offscreen-right-stepped">
<title>c41-partly-offscreen-right-stepped</title>
<style>html,body{margin:0;background:#101418;height:100%;overflow:hidden}
.o{position:absolute;background:#f0c040;border-radius:50%}
.sq{position:absolute;background:#60c0f0}
</style>
</head><body>
<div class="o" id="a"></div>
<script src="../mk.js"></script>
<script>
const MOTION = {"maxStep":0.05,"period":3};
const $ = (id) => document.getElementById(id);

MK.pure({ kind: "idle", cap: MOTION.maxStep * 1000, draw(t, inp, s) {
const f = MK.REDUCED ? 0 : MK.frameOf(t); const k = Math.floor(f / 2) * 2; const x = Math.round(1000 + 270 * (0.5 - 0.5 * Math.cos(2 * Math.PI * k / 60 / MOTION.period)));
  const el = $("a"); MK.place(el, x, 300, 40, 40);
  return { values: { x }, units: { x: "px" }, objects: { dot: { box: MK.boxOf(el), moves: ["x"] } } };
} });
</script>
</body></html>
