<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-bar" content="f17-choreo-creep-snap-40">
<title>f17-choreo-creep-snap-40</title>
<style>html,body{margin:0;background:#101418;height:100%;overflow:hidden}
.o{position:absolute;background:#f0c040;border-radius:2px}
</style>
</head><body>
<div class="o" id="xa"></div>
<div class="o" id="xb"></div>
<script src="../mk.js"></script>
<script>
const MOTION = {"maxStep":0.05,"loop":false,"phase":0,"pieces":[{"size":40,"y":200,"delay":0,"seq":[[200,2],[202,2],[204,2],[206,2],[208,8],[240,8],[242,2],[244,2],[246,2]]},{"size":40,"y":400,"delay":12,"seq":[[200,2],[203,2],[209,2],[218,2],[227,2],[233,2],[236,2],[240,8],[244,2],[252,2],[260,2],[264,2]]}]};
const NAMES = ["xa","xb"];
const els = NAMES.map((n) => document.getElementById(n));
const lens = MOTION.pieces.map((q) => q.seq.reduce((a, d) => a + d[1], 0));
function at(q, total, k) {
  if (MOTION.loop) k = ((k % total) + total) % total;
  else if (k >= total) return q.seq[q.seq.length - 1][0];
  else if (k < 0) return q.seq[0][0];
  for (const d of q.seq) { if (k < d[1]) return d[0]; k -= d[1]; }
  return q.seq[q.seq.length - 1][0];
}
MK.pure({ kind: "choreo", cap: MOTION.maxStep * 1000,
  busy(s) { return s.tap !== null && MK.frameOf(s.t - s.tap) < Math.max(...MOTION.pieces.map((q, i) => q.delay + lens[i])) + 2; },
  draw(t, inp, s) {
  const values = {}, units = {}, objects = {};
  MOTION.pieces.forEach((q, i) => {
    let k;
    if ("choreo" === "choreo") {
      if (MK.REDUCED) k = lens[i];
      else if (s.tap === null) k = -1;
      else k = MK.frameOf(t - s.tap) - q.delay;
    } else if (MK.REDUCED) k = MOTION.loop ? 0 : lens[i];
    else k = MK.frameOf(t) + MOTION.phase;
    const x = at(q, lens[i], k);
    MK.place(els[i], x, q.y, q.size, q.size);
    values[NAMES[i]] = x; units[NAMES[i]] = "px";
    objects["dot" + i] = { box: MK.boxOf(els[i]), moves: [NAMES[i]] };
  });
  return { values, units, objects };
} });
</script>
</body></html>
