<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-kind" content="idle">
<title>s02f-ticker-width-only</title>
<style>html,body{margin:0;background:#101418;height:100%;overflow:hidden}
.o{position:absolute;background:#f0c040;border-radius:50%}
.sq{position:absolute;background:#60c0f0}

</style>
</head><body>
<div class="sq" id="a"></div>
<script src="../mk.js"></script>
<script>
const MOTION = {"maxStep":0.05,"hold":7,"period":1.1666666666666667};
const $ = (id) => document.getElementById(id);
MK.pure({ kind: "idle", cap: MOTION.maxStep * 1000,  draw(t, inp, s) {
const ph = MK.REDUCED ? 0 : 2 * Math.PI * t / 1000 / MOTION.period;
const f = MK.REDUCED ? 17 : MK.frameOf(t); const k = Math.floor(f / MOTION.hold); const m = k % 10; const n = m <= 5 ? m : 10 - m;
const x = 300 + 48 * n; const w = 40 + 8 * Math.sin(ph); MK.place($("a"), x + 20 - w / 2, 340, w, 40);
return { values: { w }, units: { x: "px", w: "px" }, objects: { dot: { box: MK.boxOf($("a")), moves: ["w"] } } };
} });
</script>
</body></html>
