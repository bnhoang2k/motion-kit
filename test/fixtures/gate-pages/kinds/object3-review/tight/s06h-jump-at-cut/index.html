<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-bar" content="s06h-jump-at-cut">
<title>s06h-jump-at-cut</title>
<style>html,body{margin:0;background:#101418;height:100%;overflow:hidden}
.o{position:absolute;background:#f0c040;border-radius:50%}
.sq{position:absolute;background:#60c0f0}

</style>
</head><body>
<div class="sq" id="a"></div>
<script src="../mk.js"></script>
<script>
const MOTION = {"maxStep":0.05,"period":3};
const $ = (id) => document.getElementById(id);
MK.pure({ kind: "idle", cap: MOTION.maxStep * 1000,  draw(t, inp, s) {
const ph = MK.REDUCED ? 0 : 2 * Math.PI * t / 1000 / MOTION.period;
const after = !MK.REDUCED && t >= 1500; const x = 300 + 30 * Math.sin(ph) + (after ? 400 : 0);
document.body.style.background = after ? "#182028" : "#101418"; MK.place($("a"), x, 340, 40, 40);
return { values: { x }, units: { x: "px" }, objects: { dot: { box: MK.boxOf($("a")), moves: ["x"] } } };
} });
</script>
</body></html>
