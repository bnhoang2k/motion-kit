<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-kind" content="scroll">
<title>p08f</title>
<style>html,body{margin:0;background:#101418}
.fx{position:fixed;z-index:5}
.ab{position:absolute;z-index:5}
</style>
</head><body>
<div style="position:absolute;left:0;top:0;width:100%;height:3000px;z-index:0;background:conic-gradient(#182230 25%,#2c3e58 0 50%,#182230 0 75%,#2c3e58 0) 0 0/40px 40px"></div><div style="height:3000px"></div>
<div class="fx" id="hd" style="z-index:10"></div>
<script src="../mk.js"></script>
<script src="../rig.js"></script>
<script>
const H = RIG.H, W = RIG.W;
const el = (id) => document.getElementById(id);
const FAULT = true;
const hd = el("hd");
MK.place(hd, 0, 0, W, 64);
const sOf = (s) => Math.round(s.y);
const shadeOf = (s) => Math.min(1, sOf(s) / MOTION.shadeSpan);
const MOTION = {"maxStep":0.05,"redStep":500,"smooth":0,"shadeSpan":300};
MK.run({ kind: "scroll", cap: MOTION.maxStep * 1000,
  init: () => ({ y: 0, target: 0, prevTarget: 0 }),
  step(s, dt, inp, t) { RIG.scrollStep(s, dt, inp, MOTION); },
  render(s) { if (MK.SEEK && !MK.REDUCED && MOTION.smooth > 0) window.scrollTo(0, sOf(s));
    const k = shadeOf(s); hd.style.background = "rgb(" + (10 + 240 * k) + ",52,66)"; },
  report(s) { return { values: { shade: shadeOf(s), hdrO: 1 }, units: { shade: "ratio", hdrO: "opacity" }, objects: { hdr: { box: MK.boxOf(hd), moves: FAULT ? ["hdrO"] : ["shade"] } } }; },
});
</script>
</body></html>
