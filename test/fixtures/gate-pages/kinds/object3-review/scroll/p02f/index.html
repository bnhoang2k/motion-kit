<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-bar" content="p02f">
<title>p02f</title>
<style>html,body{margin:0;background:#101418}
.fx{position:fixed;z-index:5}
.ab{position:absolute;z-index:5}
</style>
</head><body>
<div style="position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;background:conic-gradient(#182230 25%,#2c3e58 0 50%,#182230 0 75%,#2c3e58 0) 0 0/40px 40px"></div><div style="height:3000px"></div>
<div class="fx" id="a" style="background:#f0c040;border-radius:50%"></div>
<script src="../mk.js"></script>
<script src="../rig.js"></script>
<script>
const H = RIG.H, W = RIG.W;
const el = (id) => document.getElementById(id);
const FAULT = true;
const a = el("a");
const fxOf = (s) => 300 + MOTION.stepPx * Math.floor(s.y / MOTION.per);
const MOTION = {"maxStep":0.05,"redStep":500,"smooth":0,"per":20,"stepPx":12};
MK.run({ kind: "scroll", cap: MOTION.maxStep * 1000,
  init: () => ({ y: 0, target: 0, prevTarget: 0 }),
  step(s, dt, inp, t) { RIG.scrollStep(s, dt, inp, MOTION); },
  render(s) { MK.place(a, FAULT ? 300 : fxOf(s), 300, 40, 40); },
  report(s) { const fx = fxOf(s); return { values: { fx }, units: { fx: "px" }, objects: { dot: { box: FAULT ? [fx, 300, 40, 40] : MK.boxOf(a), moves: ["fx"] } } }; },
});
</script>
</body></html>
