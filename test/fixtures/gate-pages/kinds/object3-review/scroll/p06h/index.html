<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-kind" content="scroll">
<title>p06h</title>
<style>html,body{margin:0;background:#101418}
.fx{position:fixed;z-index:5}
.ab{position:absolute;z-index:5}
</style>
</head><body>
<div style="position:absolute;left:0;top:0;width:100%;height:3000px;z-index:0;background:conic-gradient(#182230 25%,#2c3e58 0 50%,#182230 0 75%,#2c3e58 0) 0 0/40px 40px"></div><div style="height:3000px"></div>
<div class="fx" id="c" style="background:#f07050"></div>
<script src="../mk.js"></script>
<script src="../rig.js"></script>
<script>
const H = RIG.H, W = RIG.W;
const el = (id) => document.getElementById(id);
const FAULT = false;
const c = el("c"), cw = 120, ch = 70, cx = Math.round(W * 0.35), y0 = H - 90;
const yOf = (s) => y0 - MOTION.p * s.y;
const MOTION = {"maxStep":0.05,"redStep":500,"smooth":0,"p":1.5};
MK.run({ kind: "scroll", cap: MOTION.maxStep * 1000,
  init: () => ({ y: 0, target: 0, prevTarget: 0 }),
  step(s, dt, inp, t) { RIG.scrollStep(s, dt, inp, MOTION); },
  render(s) { MK.place(c, cx, yOf(s), cw, ch); },
  report(s) { const cardY = yOf(s); const b = MK.boxOf(c); const box = FAULT ? [b[0] + 10, b[1], b[2], b[3]] : b;
    return { values: { cardY }, units: { cardY: "px" }, objects: { card: { box, moves: ["cardY"] } } }; },
});
</script>
</body></html>
