<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-kind" content="scroll">
<title>p15h</title>
<style>html,body{margin:0;background:#101418}
.fx{position:fixed;z-index:5}
.ab{position:absolute;z-index:5}
</style>
</head><body>
<div style="position:absolute;left:0;top:0;width:100%;height:3000px;z-index:0;background:conic-gradient(#182230 25%,#2c3e58 0 50%,#182230 0 75%,#2c3e58 0) 0 0/40px 40px"></div><div style="height:3000px"></div>
<div class="ab" id="tr" style="background:#333a44"></div><div class="ab" id="fi" style="background:#f0c040;z-index:6"></div>
<script src="../mk.js"></script>
<script src="../rig.js"></script>
<script>
const H = RIG.H, W = RIG.W;
const el = (id) => document.getElementById(id);
const FAULT = false;
const tr = el("tr"), fi = el("fi"), tx = Math.round(W / 2 - 150), ty = Math.round(H / 2 + 40);
MK.place(tr, tx, ty, 300, 20);
const wOf = (s) => Math.min(300, 40 + MOTION.gain * s.y);
const MOTION = {"maxStep":0.05,"redStep":500,"smooth":0,"gain":0.66};
MK.run({ kind: "scroll", cap: MOTION.maxStep * 1000,
  init: () => ({ y: 0, target: 0, prevTarget: 0 }),
  step(s, dt, inp, t) { RIG.scrollStep(s, dt, inp, MOTION); },
  render(s) { MK.place(fi, tx, ty, wOf(s), 20); },
  report(s) { return { values: { fill: wOf(s) / 300 }, units: { fill: "ratio" }, objects: { fill: { box: MK.boxOf(FAULT ? tr : fi), moves: ["fill"] } } }; },
});
</script>
</body></html>
