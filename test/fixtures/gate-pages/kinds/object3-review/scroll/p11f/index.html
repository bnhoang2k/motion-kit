<!doctype html>
<html><head><meta charset="utf-8">
<meta name="motion-kit-kind" content="scroll">
<title>p11f</title>
<style>html,body{margin:0;background:#101418}
.fx{position:fixed;z-index:5}
.ab{position:absolute;z-index:5}
</style>
</head><body>
<div id="hd" style="position:sticky;top:0;height:64px;background:#2a3442;z-index:10"></div><div style="position:absolute;left:0;top:0;width:100%;height:3000px;z-index:0;background:conic-gradient(#182230 25%,#2c3e58 0 50%,#182230 0 75%,#2c3e58 0) 0 0/40px 40px"></div><div style="height:3000px"></div>
<div class="fx" id="b" style="background:#50d0a0;border-radius:50%;z-index:20"></div>
<script src="../mk.js"></script>
<script src="../rig.js"></script>
<script>
const H = RIG.H, W = RIG.W;
const el = (id) => document.getElementById(id);
const FAULT = true;
const hd = el("hd"), b = el("b"), bx = Math.round(W * 0.3), y0 = Math.round(H / 2 - 30);
const yOf = (s) => y0 - MOTION.p * s.y;
const MOTION = {"maxStep":0.05,"redStep":500,"smooth":0,"p":0.5};
MK.run({ kind: "scroll", cap: MOTION.maxStep * 1000,
  init: () => ({ y: 0, target: 0, prevTarget: 0 }),
  step(s, dt, inp, t) { RIG.scrollStep(s, dt, inp, MOTION); },
  render(s) { MK.place(b, bx, yOf(s), 60, 60); },
  report(s) { const objects = { hdr: { box: MK.boxOf(hd), moves: ["hdrO"] } };
    if (!FAULT) objects.blob = { box: MK.boxOf(b), moves: ["blobY"] };
    return { values: { blobY: yOf(s), hdrO: 1 }, units: { blobY: "px", hdrO: "opacity" }, objects }; },
});
</script>
</body></html>
