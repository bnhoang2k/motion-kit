<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-kit-kind" content="scroll">
<title>scroll: drawn-scroll</title>
<style>html { background: #fff } body { margin: 0; height: 3000px; background: repeating-linear-gradient(180deg, #fff 0, #fff 20px, #ccc 20px, #ccc 40px) } #bar { position: fixed; left: 0; top: 340px; width: 40px; height: 40px; background: #333 }</style>
</head>
<body>
<div id="bar"></div>
<script>
// The drawn check on a scroll page that scrolls itself under ?seek: the striped page moves with every scroll, so a
// pair that spans a scroll is compared in both frames of reference. The bar is a smooth follower, drawn where the page
// reports it (a flipbook's drawings are jumps to the sudden-jumps rule on a page that does not name them stepped).
window.FAULT = "";
window.VARIANT = "stepped";
window.SCROLLS = true;
</script>
<script src="scroll.js"></script>
</body>
</html>
