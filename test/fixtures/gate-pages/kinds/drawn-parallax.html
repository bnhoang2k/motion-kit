<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-kit-kind" content="scroll">
<title>scroll: drawn-parallax</title>
<style>html { background: #fff } body { margin: 0; height: 3000px; background: repeating-linear-gradient(180deg, #fff 0, #fff 20px, #ccc 20px, #ccc 40px) } #bar { position: fixed; left: 0; top: 340px; width: 40px; height: 40px; background: #333 } #moon { position: fixed; left: 800px; top: 200px; width: 160px; height: 160px; border-radius: 50%; background: #e8b04a }</style>
</head>
<body>
<div id="moon"></div>
<div id="bar"></div>
<script>
// The drawn check on a scroll page that scrolls itself under ?seek, so pairs span its scrolls: a fault. A moon no object reports moves at half the speed of the scroll (parallax), so it changes only across a scroll. The bar is the flipbook, drawn where the page reports it.
window.FAULT = "";
window.VARIANT = "flipbook";
window.SCROLLS = true;
</script>
<script src="scroll.js"></script>
<script>
// Each seek places the moon by the scroll the seek left.
{
  const moon = document.getElementById("moon");
  const seek = window.__seek;
  window.__seek = (ms) => {
    seek(ms);
    moon.style.transform = `translateY(${-0.5 * window.scrollY}px)`;
  };
}
</script>
</body>
</html>
