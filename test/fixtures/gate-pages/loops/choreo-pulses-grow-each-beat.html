<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-kit-kind" content="choreo">
<title>choreo: a tap starts pulses that grow 6 px each beat</title>
<style>html { background: #fff } body { margin: 0 } .b { position: fixed; width: 40px; height: 40px; border-radius: 8px; background: #333 }</style>
</head>
<body>
<script>window.RESTART = false; window.NOSEQ = false;
const MOTION = { travelPx: 200, slideS: 0.4, staggerS: 0.12, ...{ beatS: 1, upS: 0.25, downS: 0.35, growPx: 6, endS: Infinity, reducedAtS: 0 } };
const UNITS = { y: "px" };
function valuesAfter(d) { if (d === null) return { y: 0 }; const M = MOTION; const k = Math.floor(d / M.beatS), u = d - k * M.beatS, a = M.growPx * (k + 1); const sh = u < M.upS ? (1 - Math.cos(Math.PI * u / M.upS)) / 2 : u < M.upS + M.downS ? (1 + Math.cos(Math.PI * (u - M.upS) / M.downS)) / 2 : 0; return { y: -a * sh }; }
</script>
<script src="beats.js"></script>
</body>
</html>
