<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-kit-kind" content="choreo">
<title>choreo: a tap starts a heartbeat of keyframes with no hold</title>
<style>html { background: #fff } body { margin: 0 } .b { position: fixed; width: 60px; height: 60px; border-radius: 50%; background: #333 }</style>
</head>
<body>
<script>
const MOTION = { maxStepS: 0.05, reducedD: 10, slideS: 0.4, slidePx: 100 };
const UNITS = Object.assign({ x0: "px", x1: "px" }, { s: "scale" });
function loop(d) { const bz=(x1,y1,x2,y2)=>{const at=(a,b,s)=>3*a*(1-s)**2*s+3*b*(1-s)*s**2+s**3;return(p)=>{if(p<=0)return 0;if(p>=1)return 1;let lo=0,hi=1;for(let i=0;i<40;i++){const m=(lo+hi)/2;if(at(x1,x2,m)<p)lo=m;else hi=m;}return at(y1,y2,(lo+hi)/2);};}; const e=bz(0.42,0,0.58,1); const K=[[0,1],[0.2,1.2],[0.4,1.05],[0.6,1.15],[1,1]]; const u=(d/1.2)%1; for(let k=0;k<K.length-1;k++){ if(u<K[k+1][0]){ const p=(u-K[k][0])/(K[k+1][0]-K[k][0]); return { s: K[k][1]+(K[k+1][1]-K[k][1])*e(p) }; } } return { s: 1 }; }
function valuesAt(d) {
  const sl = (k) => { const p = d === null ? 0 : Math.max(0, Math.min(1, (d - 0.12 * k) / MOTION.slideS)); return MOTION.slidePx * (1 - (1 - p) ** 3); };
  return Object.assign({ x0: sl(0), x1: sl(1) }, loop(d === null ? 0 : d));
}
</script>
<script src="value-at.js"></script>
</body>
</html>
