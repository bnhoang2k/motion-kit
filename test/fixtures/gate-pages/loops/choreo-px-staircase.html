<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-kit-kind" content="choreo">
<title>choreo: a tap starts a px value that steps 20 px every 1.2 s</title>
<style>html { background: #fff } body { margin: 0 } .b { position: fixed; width: 40px; height: 40px; border-radius: 8px; background: #333 }</style>
</head>
<body>
<script>window.RESTART = false; window.NOSEQ = false;
const MOTION = { travelPx: 200, slideS: 0.4, staggerS: 0.12, ...{ stepPx: 20, stepS: 0.3, everyS: 1.2, endS: Infinity, reducedAtS: 0 } };
const UNITS = { y: "px" };
function valuesAfter(d) { if (d === null) return { y: 0 }; const M = MOTION; const k = Math.floor(d / M.everyS), r = Math.min(1, (d - k * M.everyS) / M.stepS); return { y: M.stepPx * (k + 1 - (1 - r) ** 3) }; }
</script>
<script src="beats.js"></script>
</body>
</html>
