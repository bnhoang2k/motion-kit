<style>

<script>
'use strict';

/* ==========================================================================
   MOTION: every number that shapes time or distance lives here.
   Times are in ms. "since grab" counts from the pointer down, "since release"
   from the pointer up, "since commit" from the release that committed
   (2933 ms into trace.json). A time with no "since" is ms into trace.json.
   Lengths are CSS px on the 393 x 852 screen.
   "Row N" and the other labels group the numbers as notes.md, MOTION values, does.
   ========================================================================== */
const MOTION = {
  /* -- screen and zipper geometry (Viewport, Paint, Gap geometry) -- */
  screenW: 393,                 // Viewport
  screenH: 852,                 // Viewport
  gapCenterX: 197.2,            // Gap geometry: gap center x
  restSliderTop: 94.6,          // Row 1: slider top at rest
  ringBelowTop: 68.9,           // Input: the finger holds the ring, slider top + 68.9
  tabPivotBelowTop: 20,         // Row 2: tab pivot 20 below slider top
  tabLength: 81,                // Paint: tab 81 from body top to ring bottom
  apexAbove: 7.8,               // Gap geometry: apex sits 7.8 above slider top while moving
  apexAboveAtRest: 9.2,         // Gap geometry: 9.2 above at rest, fades to 7.8 over the first 20 px of pull
  apexAboveRestFade: 20,        // Gap geometry: the apex offset fades over the first 20 px of pull
  // Gap geometry: half width of the gap at d px above the apex, d then half width
  gapHalfWidth: [[0, 0], [50, 6.8], [100, 16.0], [200, 41.7], [300, 73.3], [400, 108.9], [500, 142.9], [600, 169.3], [700, 188.5], [1400, 272.5]],
  clothExtraShift: 2.5,         // Cloth geometry: each half slides outward by half width + 2 to 3
  clothSettleBelowApex: 18,     // Cloth geometry: the extra shift decays over about 18 px below the apex
  statusBlurBand: 52,           // Paint: the top 52 px of the cloth is blurred

  /* -- input (Input, Threshold) -- */
  commitSliderTop: 426,         // Threshold: half the screen, between the two traced pulls: 366.6 springs back, 585 commits
  grabReachX: 30,               // hit width of the tab (page choice)
  releaseLeadMs: 16.7,          // Rows 5, 6, 11: one-shot motion after a release is timed from one frame before the frame that sees the

                                // run-on and header start one frame (17 ms) late.

  /* -- Row 5: spring back after release -- */
  springOmega: 22.25,           // Row 5: damped spring, rad/s
  springZeta: 0.84,             // Row 5: damping ratio, start speed zero
  springRestPx: 0.01,           // the spring is at rest once its swing can no longer move the slider 0.01 px (page choice)

  /* -- Rows 2 and 8: pull tab while held. [ms since grab, degrees right]. The first grab uses table 0, every later grab table 1 -- */
  tabGrab: [
    [[0, 10.8], [17, 11.9], [33, 11.9], [67, 9.6], [84, 8.5], [117, 6.2], [150, 5.7], [234, 3.9], [317, 3.9], [434, 6.2], [484, 6.2]],   // Row 2 (grab 1)
    [[0, 48], [34, 48], [50, 30], [67, 19], [84, 12], [100, 8.5], [117, 5.7], [150, 3.4], [184, 1.7], [317, 2.0], [434, 6.2], [634, 6.2], [850, 3.7], [1000, 3.7]] // Row 8 (grab 2)
  ],
  /* -- Row 6: pull tab swings like a damped pendulum after release -- */
  tabReleaseLag: 16,            // Row 6: swing starts 1 frame after the slider spring (1183 vs 1167)
  tabSwingOmega: 12.26,         // Row 6: sqrt(12.2^2 + 1.22^2), about 0.52 s period
  tabSwingDamp: 1.22,           // Row 6: decay rate (each half swing 0.73 of the last)
  tabReleaseSpeed: -25.3,       // Row 6: degrees per second toward 0 at release, so 0 is crossed at +109 ms

  runEaseInMs: 24,              // Row 11: time constant of the ease-in
  runPeakAtMs: 140,             // Row 12: speed peaks 140 ms after the commit, ease out after it
  runSlowdown: 13750,           // Row 12: px/s^2 while the halves slow (31 px per frame by 3200)
  runApexFadeMs: 84,            // Row 11: apex offset 7.8 falls to 0 by the time the slider is at 799.8 (3017)

  restRefSliderTop: 585.2,      // Row 10: reference slider top at release; the run is scaled from here

  /* -- Row 14: logo rises into place -- */
  logoRiseFrom: 129,            // Row 14: starts 129 below its rest
  logoRiseStartMs: 105,         // Row 14: the rise starts 105 ms after the commit
  logoRiseOmega: 8.9,           // Row 14: critically damped, rad/s
  // Row 15: logo blur sigma in px. [ms since commit, sigma]
  logoBlur: [[100, 22], [184, 15.4], [200, 13.3], [217, 9.7], [234, 9.2], [267, 8.1], [317, 6.2], [367, 4.0], [417, 3.3], [467, 2.9], [517, 2.2], [567, 1.2], [617, 0]],

  logoOpacity: [[100, 0], [117, 0.185], [167, 0.28], [217, 0.41], [267, 0.50], [317, 0.65], [367, 0.815], [467, 0.887], [567, 0.968], [650, 1]],

  logoScale: [[100, 0.88], [167, 0.88], [200, 0.926], [217, 0.94], [450, 0.95], [467, 0.959], [500, 0.967], [567, 0.979], [600, 0.984], [650, 0.992], [767, 0.992], [784, 1]],

  /* -- Row 17: title, 9 letters left to right -- */
  titleFirstStartMs: 15,        // Row 17: letter 1 begins 15 ms after the commit
  titleStaggerMs: 55,           // Row 17: 55 ms per letter
  titleFadeMs: 275,             // Row 17: opacity = (t / 275) squared, 10 to 90 percent in about 190 ms
  titleRisePx: 6,               // Row 17: each letter starts 6 px low and rises into place
  titleRiseMs: 350,             // Row 17: rise is done about 350 ms after the letter starts (letter 1 by 3300)
  titleBlurPx: 5,               // Row 17: letters go from soft to sharp

  /* -- Row 18: rainbow draws into the logo window -- */
  rainbowDrawMs: 184,           // Row 18: outer band reaches the window edge at 3767
  // Row 18: start of each band, ms since commit, outer first
  rainbowBandStartMs: [650, 700, 720, 770, 850],
  rainbowInnerDrawMs: 165,      // Row 18: inner bands draw faster than the outer one
  /* -- Row 19: clouds build in. [ms since commit, opacity]. They finish building at 1667 ms. -- */
  clouds: [[634, 0], [667, 0.04], [767, 0.20], [867, 0.37], [967, 0.53], [1067, 0.63], [1200, 0.75], [1334, 0.85], [1467, 0.95], [1600, 0.99], [1667, 1]],
  /* -- Row 20: home indicator dims then fades out. grey level (0 to 255) by ms since commit -- */
  homeGrey: [[0, 240], [67, 240], [134, 208], [200, 167], [334, 166], [400, 151], [467, 127], [534, 103], [600, 80], [667, 59], [734, 47], [800, 33], [867, 16], [934, 16]],
  homeFade: [1017, 1200],       // Row 20: the bar blends into the background, ms since commit
  headerEndMs: 1700,            // Row 19: the header motion ends here, just after the clouds finish (1667)

  /* -- loop -- */
  frameMs: 16.7,                // one frame at 60 fps
  maxStep: 50                   // capped time step per frame, ms
};

/* ---------- helpers ---------- */
const W = MOTION.screenW, H = MOTION.screenH, CX = MOTION.gapCenterX, REST = MOTION.restSliderTop;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Monotone cubic through points, held flat outside the first and last x.
function curve(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const h = [], d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; d[i] = (ys[i + 1] - ys[i]) / h[i]; }
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const t = (x - xs[i]) / h[i], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h[i] * m[i + 1];
  };
}
const gapHW = curve(MOTION.gapHalfWidth);
const tabCurves = MOTION.tabGrab.map(curve);
const fLogoBlur = curve(MOTION.logoBlur), fLogoOpacity = curve(MOTION.logoOpacity), fLogoScale = curve(MOTION.logoScale);
const fClouds = curve(MOTION.clouds), fHomeGrey = curve(MOTION.homeGrey);

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const phone = $('phone'), canvas = $('cloth'), logo = $('logo'), titleEl = $('title'), homebar = $('homebar'), cloudsEl = $('clouds'), bandsEl = $('bands');
const ctx = canvas.getContext('2d');
const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);

// title letters
const TITLE = 'Dashboard';
const letters = [...TITLE].map(ch => { const s = document.createElement('span'); s.textContent = ch; titleEl.appendChild(s); return s; });
function fitTitle() {
  // Scale the 9 letters so the word fills a 262.5 px title box (Row 17: x 66.5 to 329.0).
  titleEl.style.width = 'auto'; titleEl.style.fontSize = '58px';
  const nat = titleEl.scrollWidth;
  const size = Math.min(58, 58 * 262.5 / nat);
  titleEl.style.fontSize = size.toFixed(2) + 'px';
  titleEl.style.left = (66.5 + (262.5 - titleEl.scrollWidth) / 2).toFixed(2) + 'px';
}
fitTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

// rainbow bands: arcs of one circle, drawn as strokes (pathLength = 1 so the dash maths is plain)
// Band colours, outer first: magenta, red orange, orange, yellow green, green
const BANDS = ['#d7287a', '#f5604a', '#e8a334', '#b0c032', '#4cc85c'];
// The outer band's outer edge is one circle through (202.8, 195), (211.1, 185) and its top point (238, 174):
// center (238, 214) screen px, radius 40. The window bottom is y 202 and its right edge x 243, so each band runs from its
// foot on the window bottom to the window's right edge.
const ARC = { cx: 238 - 138.7, cy: 214 - 105.1, r: 40, bandW: 2.3, footY: 202 - 105.1, edgeX: 243 - 138.7 };
const bandEls = BANDS.map((col, i) => {
  const r = ARC.r - ARC.bandW / 2 - i * ARC.bandW, p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const pt = a => [ARC.cx + r * Math.cos(a), ARC.cy + r * Math.sin(a)];
  const a0 = Math.PI + Math.asin((ARC.cy - ARC.footY) / r), a1 = 2 * Math.PI - Math.acos((ARC.edgeX - ARC.cx) / r);
  const s = pt(a0), e = pt(a1);
  p.setAttribute('d', `M${s[0].toFixed(2)} ${s[1].toFixed(2)} A${r} ${r} 0 0 1 ${e[0].toFixed(2)} ${e[1].toFixed(2)}`);
  p.setAttribute('stroke', col); p.setAttribute('pathLength', '1');
  p.style.strokeDasharray = '1 2'; p.style.strokeDashoffset = '1';
  bandsEl.appendChild(p); return p;
});

/* ---------- cloth texture (denim, drawn in code) ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeTexture() {
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  g.fillStyle = 'rgb(20,37,49)'; g.fillRect(0, 0, W, H);
  const r = rng(11), cols = ['rgba(104,142,162,0.55)', 'rgba(78,114,136,0.5)', 'rgba(10,22,30,0.5)', 'rgba(60,92,112,0.45)'];
  g.lineWidth = 1; g.lineCap = 'round';
  for (const col of cols) {
    g.strokeStyle = col; g.beginPath();
    const n = col.indexOf('10,22') >= 0 ? 16000 : 11000;
    for (let i = 0; i < n; i++) {
      const x = r() * (W + 10) - 5, y = r() * (H + 10) - 5, len = 3 + r() * 5, a = (-62 + (r() - 0.5) * 18) * Math.PI / 180;
      g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    }

  for (const [x, w, a] of [[40, 90, 0.10], [330, 100, 0.10], [190, 70, 0.05]]) {

const tex = makeTexture();
const texB = (() => { // blurred copy for the status band; falls back to the sharp texture where ctx.filter is missing
  const c = document.createElement('canvas'); c.width = tex.width; c.height = tex.height;
  const g = c.getContext('2d');
  if ('filter' in g) g.filter = `blur(${3 * DPR}px)`;
  g.drawImage(tex, 0, 0); return c;
})();

/* ---------- zipper geometry ---------- */
const TAPE_HALF = 32.5, STITCH = 24.5, TOOTH_OUT = 10, TOOTH_IN = 3.5, TOOTH_PITCH = 18, TOOTH_H = 5.5;
function apexOf(S, runMs) {
  const rest = clamp((S - REST) / MOTION.apexAboveRestFade, 0, 1);
  let above = MOTION.apexAbove + (MOTION.apexAboveAtRest - MOTION.apexAbove) * (1 - rest);
  if (runMs > 0) above *= 1 - clamp(runMs / MOTION.runApexFadeMs, 0, 1);   // Row 11: after release the apex closes on the slider top
  return S - above;
}
// How far a row of the left half has slid left (the right half slides the same distance right).
function slide(y, A) {
  if (y <= A) return gapHW(A - y) + MOTION.clothExtraShift;
  return MOTION.clothExtraShift * Math.exp(-(y - A) / MOTION.clothSettleBelowApex);
}

/* ---------- state ---------- */
const S0 = { mode: 'rest', S: REST, ptrY: 0, grabDY: 0, pointerId: null, springT: 0, springFrom: REST,
  run: null, commitT: null, grabs: 0, tab: { mode: 'none', grabT: 0, table: 0, sign: 1, relT: 0, th0: 0, deg: 0 }, queue: [] };
let st = JSON.parse(JSON.stringify(S0));
let simNow = 0, lastTs = null, raf = 0;
const events = {};                    // the page's event log: each name and the time it first happened, in ms
const last = { t: 0, S: REST };       // the previous update's time and slider top

// ?seek: the gate's fixed clock. No live loop runs; window.__seek(ms) replays the recorded input (see "the fixed clock" below).
const seekMode = new URLSearchParams(location.search).has('seek');
function kick() { if (!raf && !seekMode) { lastTs = null; raf = requestAnimationFrame(frame); } }

/* ---------- input ----------
   The pointer handlers below take screen px (the 393 x 852 phone). The live page feeds them from
   pointer events; under ?seek, __seek feeds them from the recorded samples. */
function toScreen(e) {
  const r = phone.getBoundingClientRect(), s = r.width / W;
  return [(e.clientX - r.left) / s, (e.clientY - r.top) / s];
}
function onTab(x, y) { return Math.abs(x - CX) <= MOTION.grabReachX && y >= st.S - 4 && y <= st.S + MOTION.tabLength + 12; }
function press(id, x, y) {            // true when the press grabs the tab
  if (st.pointerId !== null || (st.mode !== 'rest' && st.mode !== 'spring')) return false;
  if (!onTab(x, y)) return false;
  st.pointerId = id; st.queue.push(['down', x, y]); kick();
  return true;
}
function move(id, x, y) {
  if (id === st.pointerId) { st.queue.push(['move', x, y]); kick(); }
  else if (st.pointerId === null) phone.style.cursor = (st.mode === 'rest' || st.mode === 'spring') && onTab(x, y) ? 'grab' : 'default';
}
// seenAt (fixed clock only): the frame that sees the release, so the release lead below stays one frame between frames too.
function lift(id, cancelled, seenAt) { if (id === st.pointerId) { st.queue.push([cancelled ? 'cancel' : 'up', 0, 0, seenAt]); kick(); } }
phone.addEventListener('pointerdown', e => {
  if (seekMode) return;
  const [x, y] = toScreen(e);
  if (!press(e.pointerId, x, y)) return;
  e.preventDefault(); phone.focus({ preventScroll: true });
  try { phone.setPointerCapture(e.pointerId); } catch (_) {}
});
phone.addEventListener('pointermove', e => { if (!seekMode) move(e.pointerId, ...toScreen(e)); });
const up = e => { if (!seekMode) lift(e.pointerId, e.type === 'pointercancel'); };
phone.addEventListener('pointerup', up); phone.addEventListener('pointercancel', up);
phone.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') && st.mode === 'rest') { e.preventDefault(); st.queue.push(['key']); kick(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});
$('rezip').addEventListener('click', reset);

function reset() {
  st = JSON.parse(JSON.stringify(S0)); canvas.style.visibility = 'visible'; render(simNow); kick();
}

/* ---------- simulation ---------- */
function holdDeg(now) { const t = st.tab; return reduced() ? 0 : t.sign * tabCurves[t.table](now - t.grabT); }
function swingDeg(now) {
  const t = st.tab, dt = (now - t.relT) / 1000;
  if (dt <= 0) return t.deg;
  const w = MOTION.tabSwingOmega, c = MOTION.tabSwingDamp, th0 = t.th0, v0 = t.sign * MOTION.tabReleaseSpeed;
  const wd = Math.sqrt(w * w - c * c), B = (v0 + c * th0) / wd;
  // zero crossings: wd t = phi + pi/2 + k pi, with tan(phi) = B / th0. The tab rests from the Nth one on (Row 6).
  const phi = Math.atan2(B, th0);
  let k = 0, tz = 0, n = 0;
  while (n < MOTION.tabStopCrossing && k < 20) { tz = (phi + Math.PI / 2 + k * Math.PI) / wd; if (tz > 0) n++; k++; }
  if (dt >= tz) return 0;
  return Math.exp(-c * dt) * (th0 * Math.cos(wd * dt) + B * Math.sin(wd * dt));
}
function springX(dt) { // damped spring, displacement left of the 'from' offset, zero start speed (Row 5)
  const w = MOTION.springOmega, z = MOTION.springZeta, wd = w * Math.sqrt(1 - z * z);
  return Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
function springLeft(dt) { // the most springX can still swing from dt on
  const w = MOTION.springOmega, z = MOTION.springZeta, wd = w * Math.sqrt(1 - z * z);
  return Math.exp(-z * w * dt) * Math.hypot(1, z * w / wd);
}
// Run-on distance after commit of the slider top and apex, in px from the release spot (Rows 10 to 12).
function runDist(ms) {
  const M = MOTION, t = ms / 1000, tau = M.runEaseInMs / 1000, tp = M.runPeakAtMs / 1000;
  const P = x => M.runPeakSpeed * (x - tau * (1 - Math.exp(-x / tau)));
  if (t <= tp) return P(t);
  const v0 = M.runPeakSpeed * (1 - Math.exp(-tp / tau)), d = t - tp;
  return P(tp) + v0 * d - 0.5 * M.runSlowdown * d * d;
}
const RUN_END = runDist(MOTION.runCutMs);   // how far the apex travels by the cut; a shorter pull is stretched to end here too

function commit(now, instant) {
  st.commitT = now;
  st.mode = 'run';
  const from = st.S;
  // the run always ends at one spot (apex RUN_END px past restRefSliderTop), so a shorter pull is stretched
  st.run = { t0: now, from, k: (RUN_END + MOTION.restRefSliderTop - from) / RUN_END };
  if (instant) { st.mode = 'done'; canvas.style.visibility = 'hidden'; }
}
function release(frameNow, cancelled) {
  const now = frameNow - MOTION.releaseLeadMs;   // the release happened during the last frame interval
  st.pointerId = null;
  const t = st.tab;
  if (!reduced()) { t.mode = 'free'; t.th0 = holdDeg(frameNow); t.deg = t.th0; t.relT = now + MOTION.tabReleaseLag; }
  else { t.mode = 'none'; t.deg = 0; }
  if (!cancelled && st.S >= MOTION.commitSliderTop) { commit(now, reduced()); return; }
  if (st.S - REST < 0.05) { st.mode = 'rest'; st.S = REST; return; }
  if (reduced()) { st.mode = 'rest'; st.S = REST; return; }
  st.mode = 'spring'; st.springT = now; st.springFrom = st.S - REST;
}

function update(now) {
  const q = st.queue; st.queue = [];
  for (const ev of q) {
    if (ev[0] === 'down') {
      const [, x, y] = ev; st.mode = 'drag'; st.grabDY = y - st.S; st.ptrY = y;
      const side = x < CX - 2 ? -1 : 1;
      st.tab = { mode: 'hold', grabT: now, table: Math.min(st.grabs, 1), sign: side, relT: 0, th0: 0, deg: 0 };
      st.grabs++;
      if (!('grab' in events)) events.grab = now;
    } else if (ev[0] === 'move') { if (st.mode === 'drag') st.ptrY = ev[2]; }
    else if (ev[0] === 'up' || ev[0] === 'cancel') {
      if (st.mode === 'drag') {
        st.S = clamp(st.ptrY - st.grabDY, REST, H);
        if (!('release' in events)) events.release = now;
        release(ev[3] ?? now, ev[0] === 'cancel');
        if (!('commit' in events) && st.commitT !== null) events.commit = now;
      } else st.pointerId = null;
    }
    else if (ev[0] === 'key') { st.S = REST; commit(now, reduced()); }
  }
  if (st.mode === 'drag') st.S = clamp(st.ptrY - st.grabDY, REST, H);
  else if (st.mode === 'spring') {
    const dt = (now - st.springT) / 1000;
    if (dt > 1.2 || Math.abs(st.springFrom) * springLeft(dt) < MOTION.springRestPx) { st.mode = 'rest'; st.S = REST; } else st.S = REST + st.springFrom * springX(dt);
    // back: the first time the spring brings the slider top to rest, between this step and the last one
    if (!('back' in events) && st.S <= REST && last.S > REST) events.back = last.t + (now - last.t) * (last.S - REST) / (last.S - st.S);
  } else if (st.mode === 'run') {
    const ms = now - st.run.t0;
    if (ms + MOTION.frameMs / 2 >= MOTION.runCutMs) { st.mode = 'done'; canvas.style.visibility = 'hidden'; }   // Row 13: cut on the frame nearest 284
    else st.S = st.run.from + st.run.k * runDist(ms);
  }
  // tab
  const t = st.tab;
  if (t.mode === 'hold') t.deg = holdDeg(now);
  else if (t.mode === 'free') { t.deg = swingDeg(now); if (now - t.relT > 1200 || (now > t.relT && t.deg === 0)) { t.mode = 'none'; t.deg = 0; } }   // the swing rests from its stop crossing
  last.t = now; last.S = st.S;
}
function active(now) {
  if (st.queue.length || st.mode === 'drag' || st.mode === 'spring' || st.mode === 'run') return true;
  if (st.tab.mode === 'free' || st.tab.mode === 'hold') return true;
  if (st.commitT !== null && now - st.commitT < MOTION.headerEndMs) return true;
  return false;
}

/* ---------- drawing ---------- */
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function drawCloth(A) {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  const LW = Math.ceil(CX + TOOTH_IN), RX = Math.floor(CX - TOOTH_IN);   // texture column where each half ends / begins
  const yEnd = Math.min(H, Math.max(MOTION.statusBlurBand, Math.ceil(A + 110)));
  // cloth halves: every row slides outward, the texture moves with the edge
  for (let y = 0; y < yEnd; y++) {
    const o = slide(y + 0.5, A), src = y < MOTION.statusBlurBand ? texB : tex, sy = y * DPR;
    g.drawImage(src, 0, sy, LW * DPR, DPR, -o, y, LW, 1);
    g.drawImage(src, RX * DPR, sy, (W - RX) * DPR, DPR, RX + o, y, W - RX, 1);
  }
  if (yEnd < H) {
    g.drawImage(tex, 0, yEnd * DPR, LW * DPR, (H - yEnd) * DPR, 0, yEnd, LW, H - yEnd);
    g.drawImage(tex, RX * DPR, yEnd * DPR, (W - RX) * DPR, (H - yEnd) * DPR, RX, yEnd, W - RX, H - yEnd);
  }
  // sample the two edges
  const ys = []; for (let y = -12; y <= H + 12; y += 4) ys.push(y);
  const off = ys.map(y => slide(y, A));
  // polyline along the edge of one half, moved sideways by dx (dx counts outward-positive per side)
  const edge = (side, dx) => { g.beginPath(); ys.forEach((y, i) => { const x = CX + side * off[i] + dx; i ? g.lineTo(x, y) : g.moveTo(x, y); }); };
  g.lineJoin = 'round'; g.lineCap = 'butt';
  // soft fold shadow on the cloth beside the tape
  g.strokeStyle = 'rgba(0,0,0,0.09)';
  for (const side of [-1, 1]) for (let k = 1; k <= 4; k++) { g.lineWidth = 8 + 10 * k; edge(side, side * TAPE_HALF); g.stroke(); }
  // tape: black, from 32.5 outside the reference edge to 3.5 inside it
  g.strokeStyle = '#131416'; g.lineWidth = TAPE_HALF + TOOTH_IN;
  for (const side of [-1, 1]) { edge(side, side * (TAPE_HALF - TOOTH_IN) / 2); g.stroke(); }
  // stitch lines, dashes anchored to the cloth rows
  g.strokeStyle = 'rgba(232,232,232,0.82)'; g.lineWidth = 1.1;
  g.beginPath();
  for (const side of [-1, 1]) {
    for (let y0 = -12; y0 < H + 12; y0 += 12) {
      g.moveTo(CX + side * (slide(y0, A) + STITCH), y0);
      g.lineTo(CX + side * (slide(y0 + 6, A) + STITCH), y0 + 6);
    }
  }
  g.stroke();
  // teeth, tilted to follow the edge, anchored to the cloth rows
  for (const side of [-1, 1]) {
    for (let y0 = (side < 0 ? 0 : TOOTH_PITCH / 2) - TOOTH_PITCH; y0 < H + TOOTH_PITCH; y0 += TOOTH_PITCH) {
      const slope = (slide(y0 + 3, A) - slide(y0 - 3, A)) / 6;   // how fast the slide changes down the screen
      const x = CX + side * slide(y0, A);
      if (x < -30 || x > W + 30) continue;
      g.save(); g.translate(x, y0); g.rotate(-side * Math.atan(slope));
      const x0 = side < 0 ? -TOOTH_OUT : -TOOTH_IN, w = TOOTH_OUT + TOOTH_IN;
      g.fillStyle = '#a3a3a3'; g.fillRect(x0, -TOOTH_H / 2, w, TOOTH_H);
      g.fillStyle = '#d0d0d0'; g.fillRect(x0, -TOOTH_H / 2, w, 1);
      g.fillStyle = '#6f6f6f'; g.fillRect(x0, TOOTH_H / 2 - 1, w, 1);
      g.restore();
    }
  }
}

function drawSlider(S, deg) {
  const g = ctx;
  g.save(); g.translate(CX, S);
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 5; g.shadowOffsetY = 2;
  roundRect(g, -16, 0, 32, 40, 7); g.fillStyle = '#868686'; g.fill();
  g.shadowColor = 'transparent';
  roundRect(g, -12.5, 24, 25, 14, 2); g.fillStyle = '#787878'; g.fill();
  const kg = g.createLinearGradient(-6, 0, 6, 0); kg.addColorStop(0, '#9c9c9c'); kg.addColorStop(0.5, '#bcbcbc'); kg.addColorStop(1, '#8f8f8f');
  roundRect(g, -6, 1.5, 12, 31, 6); g.fillStyle = kg; g.fill();
  // pull tab, hinged at the pivot
  g.translate(0, MOTION.tabPivotBelowTop); g.rotate(-deg * Math.PI / 180);
  const L = MOTION.tabLength - MOTION.tabPivotBelowTop, ringY = MOTION.ringBelowTop - MOTION.tabPivotBelowTop;
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 4; g.shadowOffsetY = 2;
  g.beginPath();
  g.moveTo(-10.5, -2); g.arcTo(-13, -2, -13, 0, 2.5); g.lineTo(-13, L - 8); g.arcTo(-13, L, -5, L, 8); g.lineTo(5, L); g.arcTo(13, L, 13, L - 8, 8); g.lineTo(13, 0); g.arcTo(13, -2, 10.5, -2, 2.5); g.closePath();
  g.moveTo(7.2, ringY); g.arc(0, ringY, 7.2, 0, Math.PI * 2, true);
  g.fillStyle = '#a6a6a6'; g.fill('evenodd');
  g.shadowColor = 'transparent';
  g.fillStyle = 'rgba(255,255,255,0.16)'; g.fillRect(-13, -2, 26, 2);
  g.restore();
}

function render(now) {
  const S = st.S, runMs = st.mode === 'run' ? now - st.run.t0 : 0;
  if (st.mode !== 'done') { drawCloth(apexOf(S, runMs)); drawSlider(S, st.tab.deg); }
  renderHeader(now);
}

/* ---------- screen behind the cloth: logo, title, indicator ---------- */
function logoRise(t) {                // Row 14: how far below its rest the logo sits, t ms since commit
  const tau = Math.max(0, t - MOTION.logoRiseStartMs) / 1000, w = MOTION.logoRiseOmega;
  return MOTION.logoRiseFrom * (1 + w * tau) * Math.exp(-w * tau);
}
function renderHeader(now) {
  const run = st.commitT !== null;
  const t = run ? (reduced() ? 1e6 : now - st.commitT) : -1;
  // logo
  if (!run || t <= MOTION.logoOpacity[0][0]) { logo.style.opacity = '0'; }
  else {
    const dy = logoRise(t), blur = fLogoBlur(t);
    logo.style.opacity = fLogoOpacity(t).toFixed(3);
    logo.style.transform = `translateY(${dy.toFixed(2)}px) scale(${fLogoScale(t).toFixed(4)})`;
    logo.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
  }
  // title
  letters.forEach((el, i) => {
    if (!run) { el.style.opacity = '0'; return; }
    const u = clamp((t - (MOTION.titleFirstStartMs + MOTION.titleStaggerMs * i)) / MOTION.titleFadeMs, 0, 1);
    const rise = 1 - clamp((t - (MOTION.titleFirstStartMs + MOTION.titleStaggerMs * i)) / MOTION.titleRiseMs, 0, 1);
    el.style.opacity = (u * u).toFixed(3);
    el.style.transform = `translateY(${(MOTION.titleRisePx * rise).toFixed(2)}px)`;
    el.style.filter = u < 1 ? `blur(${(MOTION.titleBlurPx * (1 - u)).toFixed(2)}px)` : 'none';
  });
  // rainbow and clouds
  bandEls.forEach((p, i) => {
    const u = run ? clamp((t - MOTION.rainbowBandStartMs[i]) / (i ? MOTION.rainbowInnerDrawMs : MOTION.rainbowDrawMs), 0, 1) : 0;
    p.style.strokeDashoffset = (1 - u).toFixed(4);
  });
  cloudsEl.setAttribute('opacity', run ? fClouds(t).toFixed(3) : '0');
  // home indicator
  if (!run) { homebar.style.background = 'rgb(240,240,240)'; homebar.style.opacity = '1'; }
  else {
    const g = Math.round(fHomeGrey(t)), [f0, f1] = MOTION.homeFade;
    homebar.style.background = `rgb(${g},${g},${g})`;
    homebar.style.opacity = (1 - clamp((t - f0) / (f1 - f0), 0, 1)).toFixed(3);
  }
}

/* ---------- loop: capped time step, stops at rest ---------- */
function frame(ts) {
  raf = 0;
  const dt = lastTs === null ? 0 : Math.min(ts - lastTs, MOTION.maxStep);
  lastTs = ts; simNow += dt;
  update(simNow); render(simNow);
  if (active(simNow)) raf = requestAnimationFrame(frame); else lastTs = null;
}

/* ---------- fit to the window ---------- */
function fit() {
  const s = Math.min(1, innerWidth / W, innerHeight / H);
  phone.style.setProperty('--fit', s.toFixed(4));
}
addEventListener('resize', fit); fit();

render(0);
if (reduced()) { /* still frame of the rest state: the first render above is it */ }

/* ---------- the fixed clock (?seek) ----------
   __seek(ms) re-runs the page from 0 to ms: update(t) at every whole 1/60 s step, then once for the
   rest, and draws that frame. On the way it plays window.__input, the recorded pointer samples
   [ms, x, y] or [ms, x, y, down] in page px. The pointer sits at the latest sample at or before t.
   It is down there unless that sample's down is 0, and it is up after the last sample. So the state
   at a time depends on the drag before it, as in the live page. */
const FRAME = 1000 / 60;
const seekPointer = 'seek';
const nextFrame = (ms) => Math.ceil(ms / FRAME - 1e-9) * FRAME;   // the first whole frame at or after ms
let cursor = 0, held = false;
function feed(t, input) {             // plays the samples up to time t
  for (; cursor < input.length && input[cursor][0] <= t + 1e-9; cursor++) {
    const [ms, cx, cy, flag] = input[cursor];
    const [x, y] = toScreen({ clientX: cx, clientY: cy });
    const down = flag !== 0;
    if (down && !held) press(seekPointer, x, y);
    else if (down) move(seekPointer, x, y);
    else if (held) lift(seekPointer, false, nextFrame(ms));
    held = down;
  }
  const end = input.length ? input[input.length - 1][0] : 0;
  if (held && cursor === input.length && t > end + 1e-9) { lift(seekPointer, false, nextFrame(end + 1e-6)); held = false; }
}
window.__seek = (ms) => {
  st = JSON.parse(JSON.stringify(S0)); canvas.style.visibility = 'visible';
  for (const k of Object.keys(events)) delete events[k];
  last.t = 0; last.S = REST;
  const input = Array.isArray(window.__input) ? window.__input : [];
  cursor = 0; held = false;
  let t = 0;
  feed(t, input); update(t);
  const n = Math.floor(ms / FRAME + 1e-9);
  for (let i = 1; i <= n; i++) { t = (i * 1000) / 60; feed(t, input); update(t); }
  if (ms - t > 1e-9) { t = ms; feed(t, input); update(t); }
  simNow = t;
  render(t);
};
/* The state read, from the page's own state: slider is the slider top, in px from the screen top;
   gap is the gap's half width on the row 100 px from the screen top (0 while the gap is shut there):
   the cloth edge less the teeth, which reach 3.5 px in and tilt with the edge as drawCloth draws them.
   The gap is what shows on the screen, so it stops at the screen's edges. logo is the logo's top edge,
   in px from the screen top, as its rise and scale place it (at its start spot until it shows).
   Events: grab (the frame that takes the first press), release (the frame that sees the first
   release), back (the spring first brings the slider top to rest, between two steps) and commit
   (the frame that sees the release that commits). */
const GAP_ROW = 100;
function gapAt(y, A) {
  const slope = (slide(y + 3, A) - slide(y - 3, A)) / 6, a = Math.atan(slope);
  const o = Math.max(0, slide(y, A) - TOOTH_IN * Math.cos(a) - TOOTH_H / 2 * Math.abs(Math.sin(a)));
  return Math.max(0, Math.min(CX + o, W) - Math.max(CX - o, 0)) / 2;
}
const LOGO = { centerY: 105.1 + 59, half: 59 };   // the logo box: top 105.1, 118 px tall, scaled about its center
function logoTop() {
  const t = st.commitT === null ? 0 : reduced() ? 1e6 : simNow - st.commitT;
  return LOGO.centerY + logoRise(t) - LOGO.half * fLogoScale(t);
}
window.__state = () => {
  const open = st.mode === 'done' ? W / 2 : gapAt(GAP_ROW, apexOf(st.S, st.mode === 'run' ? simNow - st.run.t0 : 0));
  return {
    values: { slider: st.S, gap: open, logo: logoTop() },
    events: { ...events },
    units: { slider: 'px', gap: 'px', logo: 'px' },
  };
};

// small probe so a test script can read the simulation (reads only)
window.__zip = { get S() { return st.S; }, get mode() { return st.mode; }, get tab() { return st.tab.deg; }, get now() { return simNow; }, get commitT() { return st.commitT; }, apex: () => apexOf(st.S, st.mode === 'run' ? simNow - st.run.t0 : 0) };
</script>
</body>
