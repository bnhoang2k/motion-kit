<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="motion-kit-bar" content="31-breath-pacer">
<title>Breath Pacer</title>
<style>
  :root { color-scheme: dark; --bg:#000; --ink:#fff; --sub:#767676; --dot-off:#3a3a3a; --dot-on:#d3ddb2; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  body { font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); }
  /* The design is a 393 x 852 phone screen. JS scales it to fit any window. */
  #stage { position:absolute; left:50%; top:50%; width:393px; height:852px; margin:-426px 0 0 -196.5px;
    transform-origin:50% 50%; background:var(--bg); touch-action:pan-y; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; user-select:none; }
  #stage:focus-visible { box-shadow:0 0 0 2px #d3ddb2 inset; }
  /* #card holds everything that takes the shared swap scale. Its origin is 65 u under the drawing center. */
  #card { position:absolute; inset:0; transform-origin:196.5px 398.6px; will-change:transform; }
  #art { position:absolute; left:0; top:0; width:393px; height:852px; }
  /* Copy block: title, subtitle and pager flow, so a long or translated title wraps instead of running off the screen. One-line copy keeps its set place. */
  .copy { position:absolute; left:0; right:0; top:526px; padding:0 24px; box-sizing:border-box; text-align:center; }
  .title { font-size:24px; line-height:24px; letter-spacing:-.01em; font-weight:400; will-change:transform; overflow-wrap:anywhere; text-wrap:balance; }
  .sub { margin-top:6px; font-size:11px; line-height:14px; color:var(--sub); overflow-wrap:anywhere; text-wrap:balance; }
  /* Page dots are SVG circles: CSS boxes snap to device pixels and would jitter while the card scales. */
  .pg { display:block; width:100%; height:12px; margin-top:20.71px; overflow:visible; }
  @media (prefers-reduced-motion: reduce) { #card, .title { will-change:auto; } }
</style>
</head>
<body>
<div id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Pacing patterns. Tap, swipe or press an arrow key to change pattern.">
  <div id="card">
    <canvas id="art" aria-hidden="true"></canvas>
    <div class="copy">
      <div class="title" id="title" aria-live="polite"></div>
      <div class="sub" id="sub"></div>
      <svg class="pg" id="pg" aria-hidden="true"><g id="pgc"></g></svg>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================================
   MOTION: every number that sets timing, distance, easing or phase.
   Units: u is 1 / 1.6 CSS px, the drawing's unit. Time is seconds.
   "tm" is a mode's own clock: seconds since the mode's cut frame.
   Each comment names the row the number belongs to; notes.md, MOTION values, lists them.
   ============================================================================ */
const MOTION = {
  uToPx: 0.625,                       // Viewport: 1 CSS px is about 1.6 u

  /* Mode swap. notes.md, MOTION values: Swap. Every time counts from the cut (the frame the text swaps). */
  swap: {
    outStartS: 9.7/60,                // Out: starts 9.7 frames before the cut (1.7 frames before the first frame that visibly moves)
    outS: 8.9/60,                     // Out, Title translateX and shared scale: easeInOutSine over 8.9 frames (148 ms)
    titleOutDx: -19.9,                // Out, Title translateX: 0 to -19.9 u
    scaleDip: 0.9853,                 // Out, shared scale: 1 to 0.9853 (page dots rise 4.65 u about the origin 316 u above them)
    titleInDx: 19.5,                  // In, Title translateX: +19.5 u to 0
    titleInLeadS: 0.8/60,             // In: starts 0.8 frame before the cut frame
    inS: 13.05/60,                    // In: CSS ease-out over 13.05 frames (217 ms)
    scaleBackLeadS: 1/60,             // In, shared scale back to 1: starts 1 frame before the cut
    scaleBackS: 13.2/60,              // In, shared scale back to 1: CSS ease-out over 13.2 frames (220 ms)
    inBezier: [0, 0, 0.58, 1],        // In: cubic-bezier(0, 0, 0.58, 1)
    oldFadeStartS: 0.6/60,            // Crossfade, old drawing opacity: starts 0.6 frame after the cut
    oldFadeS: 11.6/60,                // Crossfade, old drawing opacity: easeOutQuad over 11.6 frames (193 ms)
    newFadeStartS: 0.1/60,            // Crossfade, new drawing opacity: starts 0.1 frame after the cut
    newFadeS: 14.8/60,                // Crossfade, new drawing opacity: easeInOutSine over 14.8 frames (247 ms)
    dotsStartS: 1/60,                 // Crossfade, page dots: start 1 frame after the cut
    dotsOldS: 11.8/60,                // Crossfade, page dots: old dot shrinks and dims, easeOutCubic over 11.8 frames
    dotsNewS: 17/60,                  // Crossfade, page dots: new dot grows and brightens, easeOutCubic over 17 frames
    originBelowCenterU: 65,           // Out, shared scale: origin about 65 u below the drawing center
  },

  /* Page dots. notes.md, MOTION values: Swap (page dots) */
  pager: { spacingU: 23, activeWU: 11.25, idleWU: 5.25, on: [211,221,178], off: [61,61,61] }, // round dots; sizes in u, colours as RGB

  /* Resonance. notes.md, MOTION values: Resonance */
  reso: {
    loopS: 4.0,                       // Resonance row: loop period 4.00 s
    dotSpeedU: 162,                   // Dot A row: constant 162 u/s, linear
    dotTopAtS: 0.237,                 // Dot A row: at the top (0, -164) at 237 ms
    circleR: 103.2, circleDy: 60.7,   // Layout: two circles r 103.2, centers y -60.7 and +60.7
    hollowMin: 41.5, hollowMax: 126.5,// Disc hollow rows: 41.5 to 126.5 u
    minHoldFromS: 0.50, minHoldToS: 0.62, // Disc hollow grows row: flat minimum 0.50 to 0.62 s
    maxAtS: 2.24,                     // Disc hollow grows row: peak at 2240 ms (linear 0.62 to 2.24 s)
    minNextAtS: 4.50,                 // Disc hollow shrinks row: linear 2.24 to 4.50 s
    discR: 164, rampPower: 0.75, peak: 31, // Paint: the disc rises to 31/255; the ramp power shapes the rise from hollow to edge
    arcQ0: [-112, 0], arcQ1: [-61, -8], arcE1: [-61, 0], // Faint arcs row: the control points give a 12.9 u bow on row y -120
    reentryPhaseS: 2.24,              // Resonance re-entry: a swap back to resonance starts its loop at phase 2.24 s
  },

  /* Box. notes.md, MOTION values: Box */
  box: {
    R: 165.6, junctionY: -4.4,        // Layout: hexagon R 165.6, junction at y -4.4
    rimSpeedU: 142,                   // Rim dots row: linear 142 u/s, counterclockwise
    rimAtS03: [205.3, 373.2, 702.1, 870.3], // Rim dots row: 4 dots, arc position from the top vertex at tm 0.30 s
    ringDotAngles: [-90, 32.4, 147.6],// Ring dots row: 3 dots on a ring centered on the junction, at -90, 32.4 and 147.6 deg
    edgeAt03: 84, edgeRate: 6.4,      // Disc edge row: 84 u at tm 0.30 s, linear 6.4 u/s
    hollowAt03: 51.5, hollowRate: 10.2, // Disc edge row: hollow 51.5 u, linear 10.2 u/s
    inhaleS: 4, holdS: 4, exhaleS: 4, hold2S: 4, // Box breath: a 4-4-4-4 count (inhale, hold, exhale, hold, 4 s each)
    yAlpha: 0.73, hexAlpha: 0.13,     // Paint: Y lines are main lines; hexagon outline is a guide line (about 32/255)
  },

  /* Physiological sigh. notes.md, MOTION values: Sigh */
  sigh: {
    vert: { a: 100.6, b: 147, speedU: 157, phiDeg: -21.6 },  // Vertical ellipse dots row: 157 u/s; dot at phi -21.6 at tm 0.9 s
    horz: { a: 146.4, b: 56.4, speedU: 134, phiDeg: [71.5, 323.3] }, // Horizontal ellipse row: 134 u/s; pair dot and the third dot at tm 0.9 s
    anchorS: 0.9,                     // the dot positions above are at tm 0.9 s
    ringStartDist: 189, ringDirX: 0.730, ringDirY: 0.683, // Soft rings row: 189 u out along each diagonal
    ringR0: 16.3, ringR1: 33.5, ringR2: 34.5, // Soft rings row: radius 16.3 to 33.5 u by 10.4 s, about 34.5 by 10.9 s
    ringPeak: 25,                     // Paint: soft ring peak, 25/255
    // Soft rings row, ease-in-out. [tm, distance from center]. 100 ms steps from tm 0.23 s; the rings reach the center at tm 2.9 s
    ringDist: [[0,189],[0.23,189],[0.33,186.25],[0.43,182.25],[0.53,176.5],[0.63,171.25],[0.73,163.5],[0.83,155],[0.93,145.5],
      [1.03,135.5],[1.13,124],[1.23,112.5],[1.33,100.75],[1.43,88.5],[1.53,76.5],[1.63,65.25],[1.75,51],[1.85,42],[1.95,34],
      [2.05,27],[2.15,21],[2.25,16],[2.35,12],[2.9,0]],
    loopAlpha: 0.13, loopDeg: 30,     // Faint loops: still at 30 deg in this mode; guide-line brightness
    circleR: 155.3,                   // Paint: a faint guide circle r 155.3 u, sigh mode only
    loopA: 96.6, loopB: 59.8, loopCx: 61.5, loopCy: 74.1, // Layout: the 4 faint loops
  },

  /* Alternate nostril. notes.md, MOTION values: Alternate nostril */
  alt: {
    ell: { a: 59.5, b: 96.3, cx: 104 }, // Layout: two ellipses 59.5 x 96.3 at x plus or minus 104
    speedU: 100,                      // Dot rows: constant 100 u/s
    phiDeg: 18.7, phiAtS: 0.317,      // Dot on the right ellipse: phi 18.7 at tm 0.317 s
    loopDegPerS: 36.0,                // Faint loops row: 36.0 deg/s counterclockwise, from 30 deg at the cut
    discHollow: 43, discEdge: 72.5, discPeak: 31, rampPower: 0.8, // Disc ring row: hollow 43 u, edge 72.5 u, still
    staticY: [-134, 0, 133.7],        // Layout: dots at y -134, 0 and +133.7
  },

  /* Belly. notes.md, MOTION values: Belly. y in u from the drawing center */
  belly: {
    startS: 0.15,                     // B1 and A2 row: rows start moving at tm 0.15 s
    halfS: 1.42,                      // Return rows: half period 1.42 s
    easeSineShare: 0.75,              // Return rows: 0.75 sine + 0.25 quad, a little sharper than a sine (peak 116 u/s vs 105)
    // first breath is linear with a hard stop (rampEnd), then eased turns between far and near
    rows: {
      B1: { x: 'B', y0: -24.4, far: 63.3,   near: -34.6, rampEndS: 1.45 },   // B1 row: 67.5 u/s to tm 1.45 s
      A2: { x: 'A', y0: 9.1,   far: -11.5,  near: 11.4,  rampEndS: 1.45 },   // A2 row: 15.9 u/s
      A1: { x: 'A', y0: -19.9, far: -106.6, near: -11.6, rampEndS: 1.683 },  // A1 row: 56.5 u/s to tm 1.683 s
      B2: { x: 'B', y0: 40.6,  far: 103.6,  near: 34.5,  rampEndS: 1.683 },  // B2 row: 41.1 u/s
    },
    xA: [-141.2,-118.2,-54.8,-31.8,31.6,54.7,118.0,141.1],   // Layout: belly dot x, rows A1 and A2
    xB: [-164.2,-95.1,-77.8,-8.7,8.5,77.7,94.9,164.0],       // Layout: belly dot x, rows B1 and B2
    lobeTallX: [-96, 0, 96], lobeTallA: 65, lobeTallB: 150, // Layout: 3 tall soft lobes (brightest at the tips)
    lobeWideA: 150, lobeWideB: 64, lobePeak: 31,              // Layout/Paint: 1 wide lobe; up to about 31/255 near the lobe ends
  },

  dotR: 4.5,                          // Layout: dots about 9 u wide
  lineW: 1.5,                         // Layout: main lines about 1.5 u wide
  lineAlpha: 0.73,                    // Layout: main lines peak at about 180/255, not white
  guideAlpha: 0.13,                   // Layout: guide lines peak at about 33/255
  stillTm: { 0: 0.55, 1: 1.2, 2: 1.4, 3: 1.4, 4: 1.45 }, // reduced motion: the rest frame of each mode
  scheduleCuts: [[300, 1], [513, 2], [662, 3], [909, 4], [1140, 0]], // Input: the fixed swap schedule (?schedule=1 and ?seek), [cut frame at 60 fps, mode]
  maxStepS: 0.05,                     // loop: longest time step per frame (3 frames), so a long frame gap cannot throw the dots
};

const MODES = [
  { title: 'even pace',   sub: 'one slow loop' },
  { title: 'cube count',  sub: 'four equal sides' },
  { title: 'paired rings',sub: 'two long ellipses' },
  { title: 'side loops',  sub: 'left and right' },
  { title: 'soft rows',   sub: 'rows trade places' },
];

/* ---------- small helpers ---------- */
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOutSine = p => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
const easeInOutQuad = p => { p = clamp(p, 0, 1); return p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2; };
const easeOutQuad = p => { p = clamp(p, 0, 1); return 1 - (1 - p) * (1 - p); };
function bezier(x1, y1, x2, y2) {   // CSS cubic-bezier solver
  const cx = 3*x1, bx = 3*(x2-x1)-cx, ax = 1-cx-bx, cy = 3*y1, by = 3*(y2-y1)-cy, ay = 1-cy-by;
  const X = t => ((ax*t+bx)*t+cx)*t, Y = t => ((ay*t+by)*t+cy)*t;
  return p => { p = clamp(p, 0, 1); let lo = 0, hi = 1, t = p;
    for (let i = 0; i < 24; i++) { const x = X(t); if (Math.abs(x-p) < 1e-5) break; if (x < p) lo = t; else hi = t; t = (lo+hi)/2; }
    return Y(t); };
}
const easeIn13 = bezier(...MOTION.swap.inBezier);
const easeBelly = p => MOTION.belly.easeSineShare*easeInOutSine(p) + (1-MOTION.belly.easeSineShare)*easeInOutQuad(p);
function ramp(table, t) {            // linear interpolation through [t, v] knots
  if (t <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) if (t <= table[i][0]) { const a = table[i-1], b = table[i]; return lerp(a[1], b[1], (t-a[0])/(b[0]-a[0])); }
  return table[table.length-1][1];
}

/* ---------- constant-speed dots on an ellipse ---------- */
function Ellipse(cx, cy, a, b) {      // phi: parametric angle, increasing = counterclockwise on screen
  const N = 1440, cum = new Float64Array(N + 1); let px = cx + a, py = cy;
  for (let i = 1; i <= N; i++) { const p = i / N * TAU, x = cx + a*Math.cos(p), y = cy - b*Math.sin(p); cum[i] = cum[i-1] + Math.hypot(x-px, y-py); px = x; py = y; }
  const len = cum[N];
  const sOf = phi => { const f = (((phi % TAU) + TAU) % TAU) / TAU * N, i = Math.floor(f); return lerp(cum[i], cum[Math.min(N, i+1)], f - i); };
  const phiOf = s => { s = ((s % len) + len) % len; let lo = 0, hi = N; while (hi - lo > 1) { const m = (lo+hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
    return (lo + (s - cum[lo]) / (cum[hi] - cum[lo])) / N * TAU; };
  return { len, at(s0, v, dt) { const p = phiOf(s0 + v*dt); return [cx + a*Math.cos(p), cy - b*Math.sin(p)]; }, sOf };
}

/* ---------- canvas drawing primitives (u space, origin at the drawing center) ---------- */
let g;                                // 2D context, set in setup
function line(x1, y1, x2, y2, alpha) { g.globalAlpha = alpha; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function ell(cx, cy, rx, ry, rot, alpha) { g.globalAlpha = alpha; g.beginPath(); g.ellipse(cx, cy, rx, ry, rot, 0, TAU); g.stroke(); }
function dot(x, y) { g.beginPath(); g.arc(x, y, MOTION.dotR, 0, TAU); g.fill(); }
const discStops = (peak, power) =>  // the disc ring's 13 gradient stops: alpha at f = i/12 from the hollow to the edge
  Array.from({ length: 13 }, (_, i) => (peak * Math.pow(i / 12, power) / 255).toFixed(4));
function disc(cx, cy, hollow, outer, peak, power, alpha) {   // clear inside the hollow, rises toward the edge, crisp outer edge
  const grad = g.createRadialGradient(cx, cy, Math.max(0, hollow), cx, cy, outer);
  discStops(peak, power).forEach((a, i) => grad.addColorStop(i / 12, `rgba(255,255,255,${a})`));
  g.globalAlpha = alpha; g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, outer, 0, TAU); g.fill(); g.fillStyle = '#fff';
}
function lobe(cx, cy, a, b, peak, horizontal) {   // soft lobe: dark across the middle, bright toward the two ends, crisp outline
  g.save(); g.translate(cx, cy); g.scale(a, b);
  const grad = horizontal ? g.createLinearGradient(-1, 0, 1, 0) : g.createLinearGradient(0, -1, 0, 1);
  for (let i = 0; i <= 12; i++) { const t = i / 12, f = Math.abs(2 * t - 1); grad.addColorStop(t, `rgba(255,255,255,${(peak * Math.pow(f, 1.4) / 255).toFixed(4)})`); }
  g.fillStyle = grad; g.beginPath(); g.arc(0, 0, 1, 0, TAU); g.fill(); g.restore();
}

/* ---------- the five drawings. Each takes its own clock tm and an opacity ---------- */
const M = MOTION;
const ELL = {
  szV: Ellipse(0, 0, M.sigh.vert.a, M.sigh.vert.b), szH: Ellipse(0, 0, M.sigh.horz.a, M.sigh.horz.b),
  alt: Ellipse(M.alt.ell.cx, 0, M.alt.ell.a, M.alt.ell.b),
};
const DRAW = [];

/* Resonance at its own clock tm, in u and radians: the disc hollow, the corner-arc bow (0 to 1) and dot A's angle.
   DRAW[0] draws it, and __state reads it. */
const RESO_SQUARE = 164;              // Layout: square corners at plus or minus 164 u
function resonanceAt(tm) {
  const r = M.reso, u = ((tm % r.loopS) + r.loopS) % r.loopS;
  // Disc hollow rows: flat minimum, linear up, linear down
  let hollow;
  if (u < r.minHoldFromS) hollow = r.hollowMax + (r.hollowMin - r.hollowMax) * ((u + r.loopS - r.maxAtS) / (r.minNextAtS - r.maxAtS));
  else if (u <= r.minHoldToS) hollow = r.hollowMin;
  else if (u < r.maxAtS) hollow = lerp(r.hollowMin, r.hollowMax, (u - r.minHoldToS) / (r.maxAtS - r.minHoldToS));
  else hollow = lerp(r.hollowMax, r.hollowMin, (u - r.maxAtS) / (r.minNextAtS - r.maxAtS));
  const norm = (hollow - r.hollowMin) / (r.hollowMax - r.hollowMin);
  const bow = easeInOutSine(norm);                                // Faint arcs row: sine-like, same timing as the hollow
  const dotTh = -Math.PI/2 + (r.dotSpeedU / r.circleR) * (tm - r.dotTopAtS);   // Dot A: clockwise from the top
  return { hollow, bow, dotTh };
}
function arcControls(bow) {           // a corner arc's control point (qx, qy) and end ex, before the corner's mirror signs
  const r = M.reso;
  return { qx: lerp(r.arcQ0[0], r.arcQ1[0], bow), qy: lerp(r.arcQ0[1], r.arcQ1[1], bow), ex: lerp(0, r.arcE1[0], bow) };
}

DRAW[0] = function resonance(tm, alpha) {
  const r = M.reso, S = RESO_SQUARE, { hollow, bow, dotTh: th } = resonanceAt(tm);
  disc(0, 0, hollow, r.discR, r.peak, r.rampPower, alpha);
  g.lineWidth = M.lineW; g.strokeStyle = '#fff';
  const ga = M.guideAlpha * alpha;
  g.beginPath(); g.globalAlpha = ga; g.rect(-S, -S, 2*S, 2*S); g.stroke();      // square
  line(0, -S, 0, S, ga); line(-S, 0, S, 0, ga);                               // center cross
  const { qx, qy, ex } = arcControls(bow);
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {                       // corner arcs
    g.globalAlpha = ga;
    g.beginPath(); g.moveTo(sx*S, sy*S); g.quadraticCurveTo(-sx*qx, -sy*qy, -sx*ex, 0); g.stroke();
    g.beginPath(); g.moveTo(sx*S, sy*S); g.quadraticCurveTo(-sx*qy, -sy*qx, 0, -sy*ex); g.stroke();
  }
  ell(0, -r.circleDy, r.circleR, r.circleR, 0, alpha * M.lineAlpha); ell(0, r.circleDy, r.circleR, r.circleR, 0, alpha * M.lineAlpha);
  g.globalAlpha = alpha; g.fillStyle = '#fff';
  for (const [x, y] of [[-S,-S],[S,-S],[-S,S],[S,S],[-S,0],[S,0],[0,0]]) dot(x, y);
  const ax = r.circleR*Math.cos(th), ay = -r.circleDy + r.circleR*Math.sin(th);
  dot(ax, ay); dot(-ax, -ay);                                               // Dot B: A turned 180 deg
};

DRAW[1] = function box(tm, alpha) {
  const b = M.box, R = b.R, h = R * Math.sqrt(3) / 2, jy = b.junctionY;
  const V = [[0,-R],[-h,-R/2],[-h,R/2],[0,R],[h,R/2],[h,-R/2]];            // counterclockwise on screen from the top
  const cyc = b.inhaleS + b.holdS + b.exhaleS + b.hold2S, c = ((tm % cyc) + cyc) % cyc;
  let k;                                                                    // breath position 0..1
  if (c < b.inhaleS) k = c / b.inhaleS * b.inhaleS; else if (c < b.inhaleS + b.holdS) k = b.inhaleS;
  else if (c < b.inhaleS + b.holdS + b.exhaleS) k = b.inhaleS - (c - b.inhaleS - b.holdS); else k = 0;
  const edge = b.edgeAt03 + b.edgeRate * (k - 0.3), hollow = b.hollowAt03 + b.hollowRate * (k - 0.3);
  disc(0, jy, hollow, edge, 31, 0.8, alpha);
  g.lineWidth = M.lineW; g.strokeStyle = '#fff';
  g.beginPath(); g.globalAlpha = b.hexAlpha * alpha; V.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.stroke();
  line(0, jy, V[1][0], V[1][1], alpha * b.yAlpha); line(0, jy, V[5][0], V[5][1], alpha * b.yAlpha); line(0, jy, 0, R, alpha * b.yAlpha);
  g.globalAlpha = alpha; g.fillStyle = '#fff';
  for (const [x, y] of [[0,-R],[0,jy],[0,R],[-h,-1.5],[h,-1.5],[-h/2,-44.7],[h/2,-44.7],[-h/2,126.7],[h/2,126.7]]) dot(x, y);
  const per = 6 * R;                                                        // rim dots at constant speed
  for (const s0 of b.rimAtS03) {
    const s = (((s0 + b.rimSpeedU * (tm - 0.3)) % per) + per) % per, e = Math.floor(s / R), f = (s - e*R) / R;
    const A = V[e % 6], B = V[(e + 1) % 6]; dot(lerp(A[0], B[0], f), lerp(A[1], B[1], f));
  }
  for (const d of b.ringDotAngles) dot((edge - 0.2) * Math.cos(d * D2R), jy + (edge - 0.2) * Math.sin(d * D2R));
};

function loops(angleDeg, alpha) {                                           // the 4 faint loops (sigh, alternate nostril)
  const s = M.sigh, th = angleDeg * D2R;
  g.lineWidth = M.lineW; g.strokeStyle = '#fff';
  ell(s.loopCx, s.loopCy, s.loopA, s.loopB, th, s.loopAlpha * alpha); ell(-s.loopCx, -s.loopCy, s.loopA, s.loopB, th, s.loopAlpha * alpha);
  ell(s.loopCx, -s.loopCy, s.loopA, s.loopB, -th, s.loopAlpha * alpha); ell(-s.loopCx, s.loopCy, s.loopA, s.loopB, -th, s.loopAlpha * alpha);
}

DRAW[2] = function sigh(tm, alpha) {
  const s = M.sigh;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {                     // soft rings, travelling to the center
    const d = ramp(s.ringDist, tm), p = clamp((s.ringStartDist - d) / (s.ringStartDist - 42), 0, 1);
    const r = s.ringR0 + (s.ringR1 - s.ringR0) * p + (s.ringR2 - s.ringR1) * clamp((42 - d) / 31, 0, 1);
    disc(sx * d * s.ringDirX, sy * d * s.ringDirY, r * 0.5, r, s.ringPeak, 1, alpha);
  }
  loops(s.loopDeg, alpha);
  g.lineWidth = M.lineW; g.strokeStyle = '#fff';
  ell(0, 0, s.circleR, s.circleR, 0, M.guideAlpha * alpha);
  ell(0, 0, s.vert.a, s.vert.b, 0, alpha * M.lineAlpha); ell(0, 0, s.horz.a, s.horz.b, 0, alpha * M.lineAlpha);
  g.globalAlpha = alpha; g.fillStyle = '#fff'; dot(0, 0);
  const dt = tm - s.anchorS;
  const v0 = ELL.szV.sOf(s.vert.phiDeg * D2R), p1 = ELL.szV.at(v0, s.vert.speedU, dt); dot(p1[0], p1[1]); dot(-p1[0], -p1[1]);
  const h0 = ELL.szH.sOf(s.horz.phiDeg[0] * D2R), h1 = ELL.szH.at(h0, s.horz.speedU, dt); dot(h1[0], h1[1]); dot(-h1[0], -h1[1]);
  const h2 = ELL.szH.at(ELL.szH.sOf(s.horz.phiDeg[1] * D2R), s.horz.speedU, dt); dot(h2[0], h2[1]);
};

DRAW[3] = function alternateNostril(tm, alpha) {
  const a = M.alt, s = M.sigh;
  disc(0, 0, a.discHollow, a.discEdge, a.discPeak, a.rampPower, alpha);
  loops(s.loopDeg - a.loopDegPerS * Math.max(0, tm), alpha);
  g.lineWidth = M.lineW; g.strokeStyle = '#fff';
  ell(a.ell.cx, 0, a.ell.a, a.ell.b, 0, alpha * M.lineAlpha); ell(-a.ell.cx, 0, a.ell.a, a.ell.b, 0, alpha * M.lineAlpha);
  g.globalAlpha = alpha; g.fillStyle = '#fff';
  for (const y of a.staticY) dot(0, y);
  const p = ELL.alt.at(ELL.alt.sOf(a.phiDeg * D2R), a.speedU, tm - a.phiAtS); dot(p[0], p[1]); dot(-p[0], -p[1]);
};

function bellyY(row, tm) {
  const be = M.belly;
  if (tm <= be.startS) return row.y0;
  if (tm < row.rampEndS) return lerp(row.y0, row.far, (tm - be.startS) / (row.rampEndS - be.startS));   // first breath: linear, hard stop
  const u = (tm - row.rampEndS) / be.halfS, k = Math.floor(u), p = easeBelly(u - k);
  return k % 2 === 0 ? lerp(row.far, row.near, p) : lerp(row.near, row.far, p);
}
DRAW[4] = function belly(tm, alpha) {
  const be = M.belly;
  g.globalAlpha = alpha; g.globalCompositeOperation = 'lighter';
  for (const x of be.lobeTallX) lobe(x, 0, be.lobeTallA, be.lobeTallB, be.lobePeak, false);
  lobe(0, 0, be.lobeWideA, be.lobeWideB, be.lobePeak, true);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = alpha; g.fillStyle = '#fff';
  for (const key in be.rows) { const row = be.rows[key], y = bellyY(row, tm); for (const x of (row.x === 'A' ? be.xA : be.xB)) dot(x, y); }
};

/* ============================================================================
   Time line. State at time T is a pure function of the swap list, so a frozen
   frame (?freeze=12.3) and a live run draw the same thing.
   swaps: [{ c, to }] c = time of the cut; the out phase starts outStartS before it.
   ============================================================================ */
const qs = new URLSearchParams(location.search);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const swaps = [];                     // { c, to }: c = time of the cut (the frame the text swaps)
const seekMode = qs.has('seek');      // fixed clock: no live loop; __seek(ms) draws the frame for that time
const scheduleMode = qs.get('schedule') === '1' || seekMode;   // ?seek plays the fixed schedule, the one trace.json follows
if (scheduleMode) for (const [f, to] of M.scheduleCuts) swaps.push({ c: f / 60, to });
const SW = M.swap, FADE_END = Math.max(SW.newFadeStartS + SW.newFadeS, SW.oldFadeStartS + SW.oldFadeS, SW.dotsStartS + SW.dotsNewS, SW.scaleBackS - SW.scaleBackLeadS);
const lastEnd = () => swaps.length ? swaps[swaps.length-1].c + FADE_END : -1;

function stateAt(T) {                // ts = time since the cut (negative during the out phase)
  let cur = 0, enter = 0, phase = 0, prev = null, ev = null;
  for (const e of swaps) { if (e.c - SW.outStartS > T) break; prev = { mode: cur, enter, phase }; cur = e.to; enter = e.c; phase = e.to === 0 ? M.reso.reentryPhaseS : 0; ev = e; }
  const ts = ev ? T - ev.c : Infinity;
  return { cur, enter, phase, prev, ts, swapping: ev && ts < FADE_END };
}

/* ---------- DOM ---------- */
const stage = document.getElementById('stage'), card = document.getElementById('card'), canvas = document.getElementById('art');
const titleEl = document.getElementById('title'), subEl = document.getElementById('sub'), pg = document.getElementById('pg');
const pgc = document.getElementById('pgc');
const dotEls = MODES.map(() => { const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); pgc.appendChild(el); return el; });
let res = 1, textMode = -1;
function fit() {
  const k = Math.min(innerWidth / 393, innerHeight / 852);
  stage.style.transform = `scale(${k})`;
  res = k * Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(393 * res); canvas.height = Math.round(852 * res);
  g = canvas.getContext('2d');
}
addEventListener('resize', () => { fit(); render(T); });

function setPager(w) {                       // w[i] 0..1 = how active dot i is
  const P = M.pager, px = M.uToPx;
  pgc.setAttribute('transform', `translate(${pg.clientWidth / 2} 5.53)`);
  dotEls.forEach((el, i) => {
    const t = w[i], d = lerp(P.idleWU, P.activeWU, t) * px;
    el.setAttribute('r', (d / 2).toFixed(3));
    el.setAttribute('cx', ((i - (MODES.length - 1) / 2) * P.spacingU * px).toFixed(3));
    el.setAttribute('fill', `rgb(${P.off.map((c, j) => Math.round(lerp(c, P.on[j], t))).join(',')})`);
  });
}

/* ---------- render one frame at time T ---------- */
/* The swap at state st: title dx (u), shared scale, drawing opacities, page dot weights and the mode the text shows.
   render draws it, and __state reads it. */
function swapAt(st) {
  const S = SW;
  let tx = 0, sc = 1, oldA = 0, newA = 1, showMode = st.cur, dotOld = 1, dotNew = 0;
  if (st.swapping && !reduced) {
    const ts = st.ts, eOut = easeInOutSine((ts + S.outStartS) / S.outS);
    // shared scale: dips on the out curve, then returns from 1 frame before the cut
    const sb = ts + S.scaleBackLeadS, scBack = 1 - (1 - S.scaleDip) * easeInOutSine((S.outStartS - S.scaleBackLeadS) / S.outS);
    sc = sb < 0 ? 1 - (1 - S.scaleDip) * eOut : lerp(scBack, 1, easeIn13(sb / S.scaleBackS));
    if (ts < 0) {                                                   // Out
      tx = S.titleOutDx * eOut; showMode = st.prev.mode; oldA = 1; newA = 0;
    } else {                                                        // In and crossfade
      tx = S.titleInDx * (1 - easeIn13((ts + S.titleInLeadS) / S.inS));
      oldA = Math.pow(1 - clamp((ts - S.oldFadeStartS) / S.oldFadeS, 0, 1), 2);  // 1 - easeOutQuad
      newA = easeInOutSine((ts - S.newFadeStartS) / S.newFadeS);
      const ds = ts - S.dotsStartS, cub = p => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
      dotOld = ds < 0 ? 1 : 1 - cub(ds / S.dotsOldS); dotNew = ds < 0 ? 0 : cub(ds / S.dotsNewS);
    }
  }
  return { tx, sc, oldA, newA, dotOld, dotNew, showMode };
}

function render(T) {
  const st = stateAt(T);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, canvas.width, canvas.height);
  const k = res * M.uToPx; g.setTransform(k, 0, 0, k, k * 196.5 / M.uToPx, k * 358 / M.uToPx);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineCap = 'round';
  const tmOf = (mode, enter, phase) => reduced ? M.stillTm[mode] : T - enter + phase;
  const { tx, sc, oldA, newA, dotOld, dotNew, showMode } = swapAt(st);
  const drawMode = (mode, enter, phase, a) => { if (a <= 0.001) return; g.save(); DRAW[mode](tmOf(mode, enter, phase), a); g.restore(); };
  if (st.swapping && !reduced) {
    drawMode(st.prev.mode, st.prev.enter, st.prev.phase, oldA);
    drawMode(st.cur, st.enter, st.phase, newA);
  } else drawMode(st.cur, st.enter, st.phase, 1);

  // text swaps hard at the cut
  if (showMode !== textMode) { textMode = showMode; titleEl.textContent = MODES[showMode].title; subEl.textContent = MODES[showMode].sub; }
  titleEl.style.transform = `translateX(${(tx * M.uToPx).toFixed(2)}px)`;
  card.style.transform = sc === 1 ? 'none' : `scale(${sc.toFixed(5)})`;
  const w = MODES.map(() => 0);
  if (st.swapping && !reduced && st.prev) { w[st.prev.mode] = dotOld; w[st.cur] = dotNew; } else w[st.cur] = 1;
  setPager(w);
}

/* ---------- input: tap, left swipe, arrows ---------- */
let T = qs.has('freeze') ? Number(qs.get('freeze')) : 0;
function go(delta) {
  if (scheduleMode || qs.has('freeze')) return;
  if (!reduced && T < lastEnd()) return;                             // one swap at a time
  const cur = stateAt(T).cur;
  swaps.push({ c: reduced ? T - 10 : T + SW.outStartS, to: (cur + delta + MODES.length) % MODES.length });
  if (reduced) render(T);
}
let down = null;
stage.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
stage.addEventListener('pointerup', e => {
  if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) go(1); else if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
});
stage.addEventListener('pointercancel', () => { down = null; });
stage.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { go(1); e.preventDefault(); } else if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
});

/* ---------- the page clock ----------
   stepTo(t) moves the page on to time t: the live loop calls it once per frame (the step capped at
   maxStepS), and __seek(ms) calls it from 0 in whole 1/60 s steps (t = i/60, so a cut frame lands
   exactly), then once for the rest. */
fit();
const auto = Number(qs.get('auto')) || 0; let nextAuto = auto;           // ?auto=3.6 cycles on a fixed gap
const FPS = 60;                       // the fixed clock's step: 1/60 s
const events = {};                    // the page's event log: each name and the time it first happened, in ms
function resoClock(T) {               // resonance's own clock tm: from its latest cut, plus its entry phase
  if (reduced) return M.stillTm[0];
  let enter = 0, phase = 0;
  for (const e of swaps) { if (e.c - SW.outStartS > T) break; if (e.to === 0) { enter = e.c; phase = M.reso.reentryPhaseS; } }
  return T - enter + phase;
}
function stepTo(t) {
  const loop = M.reso.loopS, was = resoClock(T), h = t - T;
  T = t;
  if (auto && T >= nextAuto && T >= lastEnd()) { go(1); nextAuto = T + auto; }
  const now = resoClock(T), into = now - Math.floor(now / loop) * loop;
  // loopWrap: resonance's clock passes a whole number of loops (not by a jump at a re-entry)
  if (!('loopWrap' in events) && now - was > 0 && now - was <= h + 1e-9 && Math.floor(now / loop) > Math.floor(was / loop)) events.loopWrap = (T - into) * 1000;
  if (!('firstCut' in events) && swaps.length && T >= swaps[0].c) events.firstCut = swaps[0].c * 1000;   // the first swap's text cut
}
window.__seek = (ms) => {
  T = 0;
  for (const k of Object.keys(events)) delete events[k];
  const n = Math.floor(ms / 1000 * FPS + 1e-9);
  for (let i = 1; i <= n; i++) stepTo(i / FPS);
  if (ms / 1000 - T > 1e-12) stepTo(ms / 1000);
  render(T);
};
/* The state read: the traced values from the page's own state. From the resonance drawing: dotA is
   dot A's angle on its circle; hollow is where the disc first gets brighter than 10/255; arc is where
   the top-left outer corner arc crosses the row y = -120 u. From the swap: title is the title's
   on-screen x shift (its dx inside the scaled card); scale is the shared card scale. */
const TRACE = { hollowLevel: 10, arcRowU: -120 };
function discContour(hollow, outer, peak, power, level) {   // the radius where the disc's stops first reach level/255
  const a = discStops(peak, power).map((x) => Number(x) * 255);
  for (let i = 1; i < a.length; i++) if (a[i] >= level) return hollow + (i - 1 + (level - a[i-1]) / (a[i] - a[i-1])) / 12 * (outer - hollow);
  return outer;
}
function arcCrossX(bow, y) {          // the top-left corner's outer arc, from (-S, -S) through (qx, qy) to (ex, 0), at row y
  const S = RESO_SQUARE, { qx, qy, ex } = arcControls(bow);
  const A = -S - 2*qy, B = 2*S + 2*qy, C = -S - y, t = (-B + Math.sqrt(B*B - 4*A*C)) / (2*A);
  return (1-t)*(1-t)*-S + 2*t*(1-t)*qx + t*t*ex;
}
window.__state = () => {
  const s = resonanceAt(resoClock(T)), r = M.reso, w = swapAt(stateAt(T));
  return {
    values: {
      dotA: s.dotTh / D2R,
      hollow: discContour(s.hollow, r.discR, r.peak, r.rampPower, TRACE.hollowLevel) * M.uToPx,
      arc: arcCrossX(s.bow, TRACE.arcRowU) * M.uToPx,
      title: w.tx * w.sc * M.uToPx,
      scale: w.sc,
    },
    events: { ...events },
    units: { dotA: 'deg', hollow: 'px', arc: 'px', title: 'px', scale: 'scale' },
  };
};

/* ---------- the live loop: it runs only while the page is on screen ---------- */
let last = 0, raf = 0;
function frame(now) {
  const dt = last ? Math.min((now - last) / 1000, M.maxStepS) : 0; last = now;   // capped time step
  stepTo(T + dt);
  render(T);
  raf = requestAnimationFrame(frame);
}
function play(on) {                   // idle: pause off screen, and resume on the next frame when back
  if (on && !raf) { last = 0; raf = requestAnimationFrame(frame); }
  else if (!on && raf) { cancelAnimationFrame(raf); raf = 0; }
}
window.__breath = { time: () => T, mode: () => stateAt(T).cur, swaps };     // test hook
if (reduced || qs.has('freeze') || seekMode) render(T);
else {
  document.addEventListener('visibilitychange', () => play(!document.hidden));
  play(!document.hidden);
}
</script>
</body>
